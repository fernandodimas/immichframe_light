version: "3.8"

services:
  immichframe:
    build: .
    container_name: immichframe
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - IMMICH_URL=${IMMICH_URL:-http://192.168.1.50:2283}
      - IMMICH_API_KEY=${IMMICH_API_KEY:-}
      - IMMICH_ALBUM_ID=${IMMICH_ALBUM_ID:-}
      - INTERVAL_SECONDS=${INTERVAL_SECONDS:-15}
