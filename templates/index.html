<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimal-ui">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Immich Frame">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Immich Frame">
    <meta name="theme-color" content="#000000">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="full-screen" content="yes">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="apple-touch-icon" href="/static/icon.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/static/icon.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/static/icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/static/icon.png">
    <title>Immich Frame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            -webkit-background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
        }

        #slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #current-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #current-image.active {
            display: block;
        }

        /* Image fill mode */
        #current-image.fill {
            object-fit: cover;
        }

        /* Ken Burns zoom effect */
        @-webkit-keyframes zoomIn {
            from { -webkit-transform: scale(1); transform: scale(1); }
            to { -webkit-transform: scale(1.02); transform: scale(1.02); }
        }

        @-webkit-keyframes zoomOut {
            from { -webkit-transform: scale(1.02); transform: scale(1.02); }
            to { -webkit-transform: scale(1); transform: scale(1); }
        }

        #current-image.zoom-in {
            -webkit-animation: zoomIn 20s ease-in-out infinite alternate;
            animation: zoomIn 20s ease-in-out infinite alternate;
        }

        #current-image.zoom-out {
            -webkit-animation: zoomOut 20s ease-in-out infinite alternate;
            animation: zoomOut 20s ease-in-out infinite alternate;
        }

        /* Pan effect */
        @-webkit-keyframes panLeft {
            from { -webkit-transform: translate(0, 0); transform: translate(0, 0); }
            to { -webkit-transform: translate(-1%, 0); transform: translate(-1%, 0); }
        }

        @-webkit-keyframes panRight {
            from { -webkit-transform: translate(0, 0); transform: translate(0, 0); }
            to { -webkit-transform: translate(1%, 0); transform: translate(1%, 0); }
        }

        @-webkit-keyframes panUp {
            from { -webkit-transform: translate(0, 0); transform: translate(0, 0); }
            to { -webkit-transform: translate(0, -1%); transform: translate(0, -1%); }
        }

        @-webkit-keyframes panDown {
            from { -webkit-transform: translate(0, 0); transform: translate(0, 0); }
            to { -webkit-transform: translate(0, 1%); transform: translate(0, 1%); }
        }

        #current-image.pan-left {
            -webkit-animation: panLeft 25s ease-in-out infinite alternate;
            animation: panLeft 25s ease-in-out infinite alternate;
        }

        #current-image.pan-right {
            -webkit-animation: panRight 25s ease-in-out infinite alternate;
            animation: panRight 25s ease-in-out infinite alternate;
        }

        #current-image.pan-up {
            -webkit-animation: panUp 25s ease-in-out infinite alternate;
            animation: panUp 25s ease-in-out infinite alternate;
        }

        #current-image.pan-down {
            -webkit-animation: panDown 25s ease-in-out infinite alternate;
            animation: panDown 25s ease-in-out infinite alternate;
        }

        /* Navigation arrows */
        .nav-arrow {
            position: fixed;
            top: 50%;
            -webkit-transform: translateY(-50%);
            transform: translateY(-50%);
            width: 50px;
            height: 80px;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            opacity: 0;
            -webkit-transition: opacity 0.3s;
            transition: opacity 0.3s;
        }

        .nav-arrow:hover {
            opacity: 1 !important;
        }

        #nav-prev {
            left: 10px;
        }

        #nav-next {
            right: 10px;
        }

        .nav-arrow svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: var(--primary-color, #f5deb3);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-arrow:hover svg {
            stroke: #fff;
        }

        /* Progress bar */
        #progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 3px;
            background: var(--primary-color, #f5deb3);
            z-index: 100;
            -webkit-transition: width 0.1s linear;
            transition: width 0.1s linear;
        }

        /* Bottom left - Clock and date */
        #bottom-left {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 50;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            pointer-events: none;
            text-align: center;
        }

        #clock-date {
            color: var(--primary-color, #f5deb3);
            font-family: Helvetica, Arial, sans-serif;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            margin-bottom: 4px;
        }

        #clock {
            color: var(--primary-color, #f5deb3);
            font-family: Helvetica, Arial, sans-serif;
            font-size: 64px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        /* Weather */
        #weather {
            color: var(--primary-color, #f5deb3);
            font-family: Helvetica, Arial, sans-serif;
            font-size: 16px;
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            margin-top: 12px;
            display: none;
            -webkit-flex-direction: row;
            flex-direction: row;
            -webkit-align-items: center;
            align-items: center;
        }

        #weather.visible {
            display: -webkit-flex;
            display: flex;
        }

        #weather-icon-wrap {
            width: 40px;
            height: 40px;
            margin-right: 10px;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
        }

        #weather-icon {
            width: 40px;
            height: 40px;
            display: block;
        }

        #weather-info {
            -webkit-flex: 1;
            flex: 1;
        }

        #weather-temp {
            font-size: 20px;
            font-weight: 300;
        }

        #weather-desc {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* Bottom right - Photo info */
        #bottom-right {
            position: fixed;
            bottom: 20px;
            right: 20px;
            text-align: left;
            color: var(--primary-color, #f5deb3);
            font-size: var(--base-font-size, 17px);
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            z-index: 50;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            pointer-events: none;
            max-width: 50%;
        }

        .info-row {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: flex-start;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-icon {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            margin-top: 2px;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
            opacity: 0.9;
        }

        .info-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--primary-color, #f5deb3);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #info-album {
            font-size: 1em;
            font-weight: 400;
        }

        #info-people {
            font-size: 1em;
        }

        #info-location {
            font-size: 0.95em;
            opacity: 0.9;
        }

        #info-date {
            font-size: 0.9em;
            opacity: 0.8;
        }

        /* Keep screen awake */
        #keep-awake {
            position: fixed;
            top: -10px;
            left: -10px;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            z-index: -1;
        }

        /* Night mode overlay */
        #night-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 9999;
            display: none;
        }

        #night-overlay.active {
            display: block;
        }

        /* Error overlay */
        #error-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 10000;
            display: none;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: center;
            align-items: center;
        }

        #error-overlay.active {
            display: -webkit-flex;
            display: flex;
        }

        #error-message {
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 24px;
            text-align: center;
        }

        /* Settings gear icon */
        #settings-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            z-index: 100;
            opacity: 0;
            -webkit-transition: opacity 0.3s;
            transition: opacity 0.3s;
        }

        #settings-btn:hover {
            opacity: 1 !important;
        }

        #settings-btn svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--primary-color, #f5deb3);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Settings menu */
        #settings-menu {
            position: fixed;
            top: 70px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--primary-color, #f5deb3);
            border-radius: 8px;
            padding: 15px;
            z-index: 200;
            display: none;
            min-width: 200px;
        }

        #settings-menu.active {
            display: block;
        }

        .settings-title {
            color: var(--primary-color, #f5deb3);
            font-family: Helvetica, Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid var(--primary-color, #f5deb3);
            padding-bottom: 10px;
        }

        .settings-item {
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-align-items: center;
            align-items: center;
            padding: 8px 0;
            color: var(--primary-color, #f5deb3);
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
        }

        .settings-toggle {
            position: relative;
            width: 44px;
            height: 24px;
            background: #333;
            border-radius: 12px;
            cursor: pointer;
            -webkit-transition: background 0.3s;
            transition: background 0.3s;
        }

        .settings-toggle.on {
            background: var(--primary-color, #f5deb3);
        }

        .settings-toggle::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            -webkit-transition: transform 0.3s;
            transition: transform 0.3s;
        }

        .settings-toggle.on::after {
            -webkit-transform: translateX(20px);
            transform: translateX(20px);
        }
    </style>
</head>

    <script>
    (function () {
        var imgEl = document.getElementById("current-image");
        var clockEl = document.getElementById("clock");
        var clockDateEl = document.getElementById("clock-date");
        var progressBar = document.getElementById("progress-bar");
        var infoAlbum = document.getElementById("info-album");
        var infoPeople = document.getElementById("info-people");
        var infoLocation = document.getElementById("info-location");
        var infoDate = document.getElementById("info-date");
        var navPrev = document.getElementById("nav-prev");
        var navNext = document.getElementById("nav-next");
        var nightOverlay = document.getElementById("night-overlay");
        var settingsMenu = document.getElementById("settings-menu");

        var assets = [];
        var config = {};
        var currentIndex = 0;
        var isTransitioning = false;
        var progressInterval = null;
        var progressWidth = 0;
        // slideInterval removed - using intervals.slide
        var serverTimeOffset = 0;
        var nightModeInterval = null;
        var intervals = {};

        // Local settings (saved to localStorage)
        var localSettings = {
            shuffle: true,
            zoom: true,
            pan: false,
            fill: false,
            clock: true,
            progress: true
        };

        function loadLocalSettings() {
            try {
                var saved = localStorage.getItem("immichframe_settings");
                if (saved) {
                    var parsed = JSON.parse(saved);
                    for (var key in parsed) {
                        if (parsed.hasOwnProperty(key) && localSettings.hasOwnProperty(key)) {
                            localSettings[key] = parsed[key];
                        }
                    }
                }
            } catch (e) {}
        }

        function saveLocalSettings() {
            try {
                localStorage.setItem("immichframe_settings", JSON.stringify(localSettings));
            } catch (e) {}
        }

        function applyLocalSettings() {
            // Apply to config
            config.shuffle = localSettings.shuffle;
            config.imageZoom = localSettings.zoom;
            config.imagePan = localSettings.pan;
            config.imageFill = localSettings.fill;
            config.showClock = localSettings.clock;
            config.showProgressBar = localSettings.progress;

            // Update toggle UI
            updateToggleUI("toggle-shuffle", localSettings.shuffle);
            updateToggleUI("toggle-zoom", localSettings.zoom);
            updateToggleUI("toggle-pan", localSettings.pan);
            updateToggleUI("toggle-fill", localSettings.fill);
            updateToggleUI("toggle-clock", localSettings.clock);
            updateToggleUI("toggle-progress", localSettings.progress);

            // Apply visual changes
            if (clockEl) clockEl.style.display = localSettings.clock ? "" : "none";
            if (clockDateEl) clockDateEl.style.display = localSettings.clock ? "" : "none";
            if (progressBar) progressBar.style.display = localSettings.progress ? "" : "none";
        }

        function updateToggleUI(id, value) {
            var el = document.getElementById(id);
            if (el) {
                el.className = "settings-toggle" + (value ? " on" : "");
            }
        }

        window.toggleSettings = function () {
            settingsMenu.className = settingsMenu.className === "active" ? "" : "active";
        };

        window.toggleSetting = function (key) {
            localSettings[key] = !localSettings[key];
            saveLocalSettings();
            applyLocalSettings();

            // If shuffle changed, re-shuffle and restart
            if (key === "shuffle") {
                if (localSettings.shuffle && assets.length > 1) {
                    for (var i = assets.length - 1; i > 0; i--) {
                        var j = Math.floor(Math.random() * (i + 1));
                        var temp = assets[i];
                        assets[i] = assets[j];
                        assets[j] = temp;
                    }
                }
                currentIndex = 0;
                if (intervals.slide) {
                    window.clearInterval(intervals.slide);
                    intervals.slide = null;
                }
                startSlideshow();
            }
        };

        function padZero(n) {
            return n < 10 ? "0" + n : "" + n;
        }

        function isNightMode() {
            if (!config.nightMode) return false;

            var now = getServerTime();
            var currentMinutes = now.getHours() * 60 + now.getMinutes();

            var startParts = (config.nightModeStart || "22:00").split(":");
            var startMinutes = parseInt(startParts[0], 10) * 60 + parseInt(startParts[1], 10);

            var endParts = (config.nightModeEnd || "07:00").split(":");
            var endMinutes = parseInt(endParts[0], 10) * 60 + parseInt(endParts[1], 10);

            if (startMinutes > endMinutes) {
                return currentMinutes >= startMinutes || currentMinutes < endMinutes;
            } else {
                return currentMinutes >= startMinutes && currentMinutes < endMinutes;
            }
        }

        function updateNightMode() {
            if (isNightMode()) {
                nightOverlay.className = "active";
                stopProgress();
                if (intervals.slide) {
                    window.clearInterval(intervals.slide);
                    intervals.slide = null;
                }
            } else {
                nightOverlay.className = "";
                if (!intervals.slide && assets.length > 0) {
                    intervals.slide = window.setInterval(function () {
                        advanceToNext();
                    }, (config.interval || 20) * 1000);
                    startProgress();
                }
            }
        }

        function fetchServerTime() {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        var serverNow = new Date(data.timestamp);
                        var deviceNow = new Date();
                        serverTimeOffset = serverNow.getTime() - deviceNow.getTime();
                    } catch (e) {}
                }
            };
            xhr.open("GET", "/api/time", true);
            xhr.timeout = 5000;
            xhr.send(null);
        }

        function getServerTime() {
            return new Date(Date.now() + serverTimeOffset);
        }

        function fetchWeather() {
            var weatherEl = document.getElementById("weather");
            var weatherIcon = document.getElementById("weather-icon");
            var weatherTemp = document.getElementById("weather-temp");
            var weatherDesc = document.getElementById("weather-desc");

            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            if (data.enabled && !data.error) {
                                weatherIcon.src = data.iconUrl;
                                weatherTemp.innerHTML = data.city + ", " + data.temp + data.unit;
                                if (data.description) {
                                    weatherDesc.innerHTML = data.description;
                                }
                                weatherEl.className = "visible";
                            } else {
                                weatherEl.className = "";
                            }
                        } catch (e) {
                            weatherEl.className = "";
                        }
                    } else {
                        weatherEl.className = "";
                    }
                }
            };
            xhr.onerror = function () {
                weatherEl.className = "";
                weatherIcon.onerror = function () {
                    this.src = "/static/weather-default.png";
                };
                weatherIcon.src = "/static/weather-default.png";
            };
            xhr.open("GET", "/api/weather", true);
            xhr.timeout = 10000;
            xhr.send(null);
        }

        function formatDate(dateStr, format) {
            if (!dateStr) return "";
            var d = new Date(dateStr);
            if (isNaN(d.getTime())) return "";

            var lang = config.language || "pt";
            var days, months;
            if (lang === "en") {
                days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
                months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                          "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            } else {
                days = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sab"];
                months = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun",
                          "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
            }

            var day = d.getDate();
            var month = d.getMonth();
            var year = d.getFullYear();

            var result = format;
            result = result.replace("eeee", days[d.getDay()]);
            result = result.replace("MMMM", months[month]);
            result = result.replace("yyyy", year);
            result = result.replace(/\bdd\b/, day < 10 ? "0" + day : "" + day);
            result = result.replace(/\bd\b/, day);
            result = result.replace("MM", month + 1 < 10 ? "0" + (month + 1) : "" + (month + 1));

            result = result.replace(/'/g, "");

            return result;
        }

        function updateClock() {
            if (!config.showClock) {
                if (clockEl) clockEl.style.display = "none";
                if (clockDateEl) clockDateEl.style.display = "none";
                return;
            }

            if (clockEl) clockEl.style.display = "";
            if (clockDateEl) clockDateEl.style.display = "";

            var now = getServerTime();
            var h = padZero(now.getHours());
            var m = padZero(now.getMinutes());
            var s = padZero(now.getSeconds());

            var clockText = config.clockFormat || "HH:mm";
            clockText = clockText.replace("HH", h).replace("mm", m).replace("ss", s);

            if (clockEl) { clockEl.innerHTML = clockText; }

            if (clockDateEl) {
                var lang = config.language || "pt";
                var days, months, de;
                if (lang === "en") {
                    days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
                    months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                              "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                    de = " ";
                } else {
                    days = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sab"];
                    months = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun",
                              "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
                    de = " ";
                }
                clockDateEl.innerHTML = days[now.getDay()] + ", " + now.getDate() + de + months[now.getMonth()];
            }
        }

        function applyConfig() {
            var root = document.documentElement;
            if (config.primaryColor) {
                root.style.setProperty("--primary-color", config.primaryColor);
            }
            if (config.secondaryColor) {
                root.style.setProperty("--secondary-color", config.secondaryColor);
                document.body.style.backgroundColor = config.secondaryColor;
            }
            if (config.baseFontSize) {
                root.style.setProperty("--base-font-size", config.baseFontSize);
            }
            if (config.transition !== undefined) {
                root.style.setProperty("--transition-duration", config.transition + "s");
            }

            if (!config.showProgressBar) {
                progressBar.style.display = "none";
            }

            var albumRow = document.getElementById("info-album-row");
            var peopleRow = document.getElementById("info-people-row");
            var locationRow = document.getElementById("info-location-row");
            var dateRow = document.getElementById("info-date-row");

            if (!config.showAlbumName && albumRow) {
                albumRow.style.display = "none";
            }
            if (!config.showPeopleDesc && peopleRow) {
                peopleRow.style.display = "none";
            }
            if (!config.showImageLocation && locationRow) {
                locationRow.style.display = "none";
            }
            if (!config.showPhotoDate && dateRow) {
                dateRow.style.display = "none";
            }
        }

        function updateInfo(asset) {
            var albumRow = document.getElementById("info-album-row");
            var peopleRow = document.getElementById("info-people-row");
            var locationRow = document.getElementById("info-location-row");
            var dateRow = document.getElementById("info-date-row");

            if (config.showAlbumName && asset.albumName) {
                infoAlbum.innerHTML = asset.albumName;
                if (albumRow) albumRow.style.display = "";
            } else {
                infoAlbum.innerHTML = "";
                if (albumRow) albumRow.style.display = "none";
            }

            if (config.showPeopleDesc && asset.people && asset.people.length > 0) {
                infoPeople.innerHTML = asset.people.join(", ");
                if (peopleRow) peopleRow.style.display = "";
            } else {
                infoPeople.innerHTML = "";
                if (peopleRow) peopleRow.style.display = "none";
            }

            if (config.showImageLocation && asset.location) {
                infoLocation.innerHTML = asset.location;
                if (locationRow) locationRow.style.display = "";
            } else {
                infoLocation.innerHTML = "";
                if (locationRow) locationRow.style.display = "none";
            }

            if (config.showPhotoDate && asset.date) {
                var fmt = config.photoDateFormat || "dd/MM/yyyy";
                infoDate.innerHTML = formatDate(asset.date, fmt);
                if (dateRow) dateRow.style.display = "";
            } else {
                infoDate.innerHTML = "";
                if (dateRow) dateRow.style.display = "none";
            }
        }

        function startProgress() {
            // Clear any existing progress interval
            if (intervals.progress) {
                window.clearInterval(intervals.progress);
                intervals.progress = null;
            }
            progressWidth = 0;
            progressBar.style.width = "0%";
            intervals.progress = window.setInterval(function () {
                progressWidth += 100 / ((config.interval || 20) * 10);
                if (progressWidth >= 100) {
                    progressWidth = 100;
                    window.clearInterval(intervals.progress);
                    intervals.progress = null;
                }
                progressBar.style.width = progressWidth + "%";
            }, 100);
        }

        function stopProgress() {
            if (intervals.progress) {
                window.clearInterval(intervals.progress);
                intervals.progress = null;
            }
        }

        function getThumbUrl(assetId) {
            return "/api/thumbnail/" + assetId;
        }

        function fetchAssetDetails(assetId, callback) {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            callback(null, data);
                        } catch (e) {
                            callback("parse error");
                        }
                    } else {
                        callback("http error");
                    }
                }
            };
            xhr.onerror = function () { callback("network error"); };
            xhr.open("GET", "/api/asset/" + assetId + "/details", true);
            xhr.timeout = 10000;
            xhr.send(null);
        }

        function showImage(url, asset) {
            if (!imgEl) { return; }

            imgEl.onload = function () {
                var classes = ["active"];
                if (config.imageFill) {
                    classes.push("fill");
                }
                if (config.imageZoom) {
                    classes.push(Math.random() > 0.5 ? "zoom-in" : "zoom-out");
                }
                if (config.imagePan) {
                    var pans = ["pan-left", "pan-right", "pan-up", "pan-down"];
                    classes.push(pans[Math.floor(Math.random() * pans.length)]);
                }
                imgEl.className = classes.join(" ");
                isTransitioning = false;
                updateInfo(asset);
                startProgress();

                // Fetch detailed info on demand (people, location)
                if (asset.id) {
                    fetchAssetDetails(asset.id, function (err, details) {
                        if (!err && details) {
                            if (details.people && details.people.length > 0) {
                                asset.people = details.people;
                            }
                            if (details.location) {
                                asset.location = details.location;
                            }
                            updateInfo(asset);
                        }
                    });
                }
            };

            imgEl.onerror = function () {
                isTransitioning = false;
                advanceToNext();
            };

            imgEl.src = url;
        }

        var preloader = null;
        var preloaderTimeout = null;

        function preloadAndShow(url, asset) {
            // Clean up previous preloader
            if (preloader) {
                preloader.onload = null;
                preloader.onerror = null;
                preloader.src = "";
                preloader = null;
            }
            if (preloaderTimeout) {
                clearTimeout(preloaderTimeout);
                preloaderTimeout = null;
            }

            preloader = new Image();
            var done = false;

            function onDone(success) {
                if (done) { return; }
                done = true;
                if (preloaderTimeout) {
                    clearTimeout(preloaderTimeout);
                    preloaderTimeout = null;
                }
                if (success) {
                    showImage(url, asset);
                } else {
                    isTransitioning = false;
                    advanceToNext();
                }
            }

            preloader.onload = function () { onDone(true); };
            preloader.onerror = function () { onDone(false); };

            preloader.src = url;

            // Reduced timeout from 15s to 8s for iOS 9 compatibility
            preloaderTimeout = window.setTimeout(function () {
                if (!done) { onDone(false); }
            }, 8000);
        }

        function goToIndex(index) {
            // Clear intervals before navigating
            clearAllIntervals();
            if (assets.length === 0) { return; }
            if (isTransitioning) { return; }

            stopProgress();
            isTransitioning = true;
            currentIndex = index;
            if (currentIndex >= assets.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = assets.length - 1;

            var asset = assets[currentIndex];
            preloadAndShow(getThumbUrl(asset.id), asset);
        }

        function advanceToNext() {
            // Clear intervals before advancing
            clearAllIntervals();
            goToIndex(currentIndex + 1);
        }

        window.prevImage = function () {
            goToIndex(currentIndex - 1);
        };

        window.nextImage = function () {
            goToIndex(currentIndex + 1);
        };

        function startSlideshow() {
            if (assets.length === 0) { return; }

            isTransitioning = true;
            var asset = assets[0];
            preloadAndShow(getThumbUrl(asset.id), asset);

            intervals.slide = window.setInterval(function () {
                advanceToNext();
            }, (config.interval || 20) * 1000);
        }

        function fetchJSON(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            callback(null, data);
                        } catch (e) {
                            callback("parse error");
                        }
                    } else {
                        callback("http error");
                    }
                }
            };
            xhr.onerror = function () { callback("network error"); };
            xhr.ontimeout = function () { callback("timeout"); };
            xhr.open("GET", url, true);
            xhr.timeout = 15000;
            xhr.send(null);
        }

        function init() {
            var errorOverlay = document.getElementById("error-overlay");

            loadLocalSettings();

            fetchServerTime();
            intervals.serverTime = setInterval(fetchServerTime, 300000);

            fetchWeather();
            intervals.weather = setInterval(fetchWeather, 1800000);

            updateClock();
            intervals.clock = window.setInterval(updateClock, 1000);

            intervals.nightMode = window.setInterval(updateNightMode, 30000);

            // Auto-refresh every 30 minutes
            intervals.autoReload = window.setInterval(function () {
                window.location.reload();
            }, 1800000);

            var hideTimer;
            function showNav() {
                navPrev.style.opacity = "0.5";
                navNext.style.opacity = "0.5";
                navPrev.style.display = "";
                navNext.style.display = "";
                document.getElementById("settings-btn").style.opacity = "0.5";
                clearTimeout(hideTimer);
                intervals.navHide = window.setTimeout(function () {
                    navPrev.style.opacity = "0";
                    navNext.style.opacity = "0";
                    document.getElementById("settings-btn").style.opacity = "0";
                }, 3000);
            }

            document.addEventListener("mousemove", showNav);
            document.addEventListener("touchstart", showNav);

            fetchJSON("/api/slideshow", function (err, data) {
                if (err) {
                    errorOverlay.className = "active";
                    return;
                }

                errorOverlay.className = "";
                assets = data.assets || [];
                config = data.config || {};

                applyLocalSettings();

                if (localSettings.shuffle && assets.length > 1) {
                    for (var i = assets.length - 1; i > 0; i--) {
                        var j = Math.floor(Math.random() * (i + 1));
                        var temp = assets[i];
                        assets[i] = assets[j];
                        assets[j] = temp;
                    }
                }

                applyConfig();
                updateNightMode();
                if (!isNightMode()) {
                    startSlideshow();
                }
            });
        }

        if (document.readyState === "complete" || document.readyState === "interactive") {
            window.setTimeout(init, 0);
        } else {
            document.addEventListener("DOMContentLoaded", init);
        }

    
        // Function to clear non-essential intervals (keep slideshow running)
        function clearAllIntervals() {
            var keepKeys = ['slide'];  // Keep slideshow interval alive
            for (var key in intervals) {
                if (intervals[key] && keepKeys.indexOf(key) === -1) {
                    window.clearInterval(intervals[key]);
                    intervals[key] = null;
                }
            }
        }

        // Make clearAllIntervals available globally
        window.clearAllIntervals = clearAllIntervals;

    })(
    </script>
</body>
