<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Immich Frame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            -webkit-background-color: #000;
        }

        #slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #current-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #current-image.active {
            display: block;
        }

        #debug-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 8px 12px;
            z-index: 999;
            min-height: 40px;
            word-wrap: break-word;
        }

        #clock {
            position: fixed;
            top: 50px;
            right: 20px;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            z-index: 20;
            -webkit-user-select: none;
        }

        #clock-date {
            position: fixed;
            top: 106px;
            right: 20px;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            z-index: 20;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <div id="debug-bar">Starting...</div>

    <div id="slideshow">
        <img id="current-image" alt="" draggable="false">
    </div>

    <div id="clock">00:00</div>
    <div id="clock-date"></div>

    <script>
    (function () {
        var debugEl = document.getElementById("debug-bar");
        var clockEl = document.getElementById("clock");
        var clockDateEl = document.getElementById("clock-date");
        var imgEl = document.getElementById("current-image");

        var thumbnails = [];
        var intervalSec = 15;
        var currentIndex = 0;
        var isTransitioning = false;

        function setDebug(msg) {
            if (debugEl) {
                debugEl.innerHTML = msg;
            }
            if (window.console && console.log) {
                console.log("[Frame] " + msg);
            }
        }

        function appendDebug(msg) {
            if (debugEl) {
                debugEl.innerHTML = debugEl.innerHTML + "<br>" + msg;
            }
            if (window.console && console.log) {
                console.log("[Frame] " + msg);
            }
        }

        function padZero(n) {
            return n < 10 ? "0" + n : "" + n;
        }

        function updateClock() {
            var now = new Date();
            var h = padZero(now.getHours());
            var m = padZero(now.getMinutes());
            var s = padZero(now.getSeconds());
            if (clockEl) {
                clockEl.innerHTML = h + ":" + m + ":" + s;
            }
            var days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                          "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            if (clockDateEl) {
                clockDateEl.innerHTML = days[now.getDay()] + ", " + now.getDate() + " " + months[now.getMonth()];
            }
        }

        function showImage(url) {
            if (!imgEl) { return; }

            imgEl.onload = function () {
                setDebug("OK: Image displayed (" + (currentIndex + 1) + "/" + thumbnails.length + ")");
                imgEl.className = "active";
                isTransitioning = false;
            };

            imgEl.onerror = function () {
                appendDebug("FAIL: Could not load image");
                isTransitioning = false;
                advanceToNext();
            };

            imgEl.src = url;
        }

        function preloadAndShow(url) {
            appendDebug("Loading: " + url.substring(0, 60));
            var preloader = new Image();
            var done = false;

            function onDone(success) {
                if (done) { return; }
                done = true;
                if (success) {
                    showImage(url);
                } else {
                    appendDebug("FAIL: Preload error");
                    isTransitioning = false;
                    advanceToNext();
                }
            }

            preloader.onload = function () { onDone(true); };
            preloader.onerror = function () { onDone(false); };

            preloader.src = url;

            window.setTimeout(function () {
                if (!done) {
                    appendDebug("FAIL: Timeout 15s");
                    onDone(false);
                }
            }, 15000);
        }

        function advanceToNext() {
            if (thumbnails.length === 0) { return; }
            if (isTransitioning) { return; }
            isTransitioning = true;
            currentIndex = (currentIndex + 1) % thumbnails.length;
            preloadAndShow(thumbnails[currentIndex]);
        }

        function startSlideshow() {
            if (thumbnails.length === 0) {
                setDebug("ERROR: No images in album");
                return;
            }

            setDebug("Starting slideshow: " + thumbnails.length + " images");
            isTransitioning = true;
            preloadAndShow(thumbnails[0]);

            window.setInterval(function () {
                advanceToNext();
            }, intervalSec * 1000);
        }

        function fetchJSON(url, callback) {
            setDebug("Fetching " + url + "...");
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    appendDebug("Status: " + xhr.status);
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            appendDebug("Got " + (data.thumbnails ? data.thumbnails.length : 0) + " thumbnails");
                            callback(null, data);
                        } catch (e) {
                            appendDebug("FAIL: JSON parse error");
                            callback("parse error");
                        }
                    } else {
                        appendDebug("FAIL: HTTP " + xhr.status);
                        callback("http error");
                    }
                }
            };
            xhr.onerror = function () {
                appendDebug("FAIL: Network error");
                callback("network error");
            };
            xhr.ontimeout = function () {
                appendDebug("FAIL: Timeout");
                callback("timeout");
            };
            xhr.open("GET", url, true);
            xhr.timeout = 15000;
            xhr.send(null);
        }

        function init() {
            updateClock();
            window.setInterval(updateClock, 1000);

            fetchJSON("/api/slideshow", function (err, data) {
                if (err) {
                    setDebug("ERROR: " + err);
                    return;
                }

                thumbnails = data.thumbnails || [];
                intervalSec = data.interval || 15;

                startSlideshow();
            });
        }

        if (document.readyState === "complete" || document.readyState === "interactive") {
            window.setTimeout(init, 0);
        } else {
            document.addEventListener("DOMContentLoaded", init);
        }

    })();
    </script>
</body>
</html>
