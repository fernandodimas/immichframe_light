<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Immich Frame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            -webkit-background-color: #000;
        }

        #slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
        }

        #current-image {
            max-width: 100%;
            max-height: 100%;
            display: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #current-image.active {
            display: block;
        }

        #loading-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            -webkit-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            color: #555;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 16px;
            z-index: 10;
        }

        #error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            -webkit-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            color: #888;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
            text-align: center;
            z-index: 10;
            display: none;
        }

        #error-message.visible {
            display: block;
        }

        #status-bar {
            position: fixed;
            bottom: 8px;
            right: 12px;
            color: #555;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 11px;
            z-index: 5;
        }

        #clock {
            position: fixed;
            top: 16px;
            right: 20px;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            z-index: 20;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #clock-date {
            position: fixed;
            top: 72px;
            right: 20px;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            z-index: 20;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body>
    <div id="slideshow" data-thumbnails='{{ thumbnails_json|safe }}' data-interval="{{ interval }}">
        <img id="current-image" alt="" draggable="false">
    </div>

    <div id="loading-indicator">Loading...</div>
    <div id="error-message">
        <p>No images found.</p>
        <p>Check your Immich configuration.</p>
    </div>
    <div id="clock">00:00</div>
    <div id="clock-date"></div>
    <div id="status-bar"></div>

    <script>
    (function () {
        var clockEl = document.getElementById("clock");
        var clockDateEl = document.getElementById("clock-date");
        var imgEl = document.getElementById("current-image");
        var loadingEl = document.getElementById("loading-indicator");
        var errorEl = document.getElementById("error-message");
        var statusBar = document.getElementById("status-bar");

        function log(msg) {
            if (window.console && console.log) {
                console.log("[Frame] " + msg);
            }
        }

        function padZero(n) {
            return n < 10 ? "0" + n : "" + n;
        }

        function updateClock() {
            var now = new Date();
            var h = padZero(now.getHours());
            var m = padZero(now.getMinutes());
            var s = padZero(now.getSeconds());
            if (clockEl) {
                clockEl.innerHTML = h + ":" + m + ":" + s;
            }
            var days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                          "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            if (clockDateEl) {
                clockDateEl.innerHTML = days[now.getDay()] + ", " + now.getDate() + " " + months[now.getMonth()];
            }
        }

        function startClock() {
            updateClock();
            window.setInterval(updateClock, 1000);
        }

        function showError() {
            if (errorEl) { errorEl.className = "visible"; }
            if (loadingEl) { loadingEl.style.display = "none"; }
        }

        function hideLoading() {
            if (loadingEl) { loadingEl.style.display = "none"; }
        }

        var thumbnails = [];
        var intervalSec = 15;
        var currentIndex = 0;
        var isTransitioning = false;
        var timerId = null;

        function parseThumbnails(raw) {
            if (!raw) { return []; }
            if (typeof raw === "object") { return raw; }
            try {
                return JSON.parse(raw);
            } catch (e) {
                log("Failed to parse thumbnails JSON");
                return [];
            }
        }

        function showImage(url) {
            if (!imgEl) { return; }

            imgEl.onload = function () {
                imgEl.className = "active";
                hideLoading();
                isTransitioning = false;
                if (statusBar) {
                    statusBar.innerHTML = (currentIndex + 1) + " / " + thumbnails.length;
                }
            };

            imgEl.onerror = function () {
                log("Error: " + url);
                isTransitioning = false;
                advanceToNext();
            };

            imgEl.src = url;
        }

        function preloadAndShow(url) {
            var preloader = new Image();
            var done = false;

            function onDone(success) {
                if (done) { return; }
                done = true;
                if (success) {
                    showImage(url);
                } else {
                    isTransitioning = false;
                    advanceToNext();
                }
            }

            preloader.onload = function () { onDone(true); };
            preloader.onerror = function () { onDone(false); };

            preloader.src = url;

            window.setTimeout(function () {
                if (!done) {
                    log("Timeout: " + url);
                    onDone(false);
                }
            }, 15000);
        }

        function advanceToNext() {
            if (thumbnails.length === 0) {
                showError();
                return;
            }

            if (isTransitioning) { return; }
            isTransitioning = true;

            currentIndex = (currentIndex + 1) % thumbnails.length;
            preloadAndShow(thumbnails[currentIndex]);
        }

        function startSlideshow() {
            if (thumbnails.length === 0) {
                log("No images");
                showError();
                return;
            }

            hideLoading();
            isTransitioning = true;
            preloadAndShow(thumbnails[0]);

            timerId = window.setInterval(function () {
                advanceToNext();
            }, intervalSec * 1000);
        }

        function init() {
            startClock();

            var rawData = document.getElementById("slideshow").getAttribute("data-thumbnails");
            var rawInterval = document.getElementById("slideshow").getAttribute("data-interval");

            thumbnails = parseThumbnails(rawData);
            intervalSec = parseInt(rawInterval, 10) || 15;

            log("Images: " + thumbnails.length + ", Interval: " + intervalSec + "s");
            startSlideshow();
        }

        if (document.readyState === "complete" || document.readyState === "interactive") {
            window.setTimeout(init, 0);
        } else {
            document.addEventListener("DOMContentLoaded", init);
        }

    })();
    </script>
</body>
</html>
