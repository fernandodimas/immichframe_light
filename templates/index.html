<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Immich Frame">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Immich Frame">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23000' width='100' height='100'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>🖼</text></svg>">
    <title>Immich Frame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            -webkit-background-color: #000;
        }

        #slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #current-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #current-image.active {
            display: block;
        }

        #clock {
            position: fixed;
            top: 16px;
            right: 20px;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            z-index: 20;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #clock-date {
            position: fixed;
            top: 72px;
            right: 20px;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            z-index: 20;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body>
    <div id="slideshow">
        <img id="current-image" alt="" draggable="false">
    </div>

    <div id="clock">00:00</div>
    <div id="clock-date"></div>

    <script>
    (function () {
        var clockEl = document.getElementById("clock");
        var clockDateEl = document.getElementById("clock-date");
        var imgEl = document.getElementById("current-image");

        var assets = [];
        var intervalSec = 15;
        var currentIndex = 0;
        var isTransitioning = false;

        function padZero(n) {
            return n < 10 ? "0" + n : "" + n;
        }

        function updateClock() {
            var now = new Date();
            var h = padZero(now.getHours());
            var m = padZero(now.getMinutes());
            var s = padZero(now.getSeconds());
            if (clockEl) { clockEl.innerHTML = h + ":" + m + ":" + s; }
            var days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                          "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            if (clockDateEl) {
                clockDateEl.innerHTML = days[now.getDay()] + ", " + now.getDate() + " " + months[now.getMonth()];
            }
        }

        function getThumbUrl(assetId) {
            return "/api/thumbnail/" + assetId;
        }

        function showImage(url) {
            if (!imgEl) { return; }

            imgEl.onload = function () {
                imgEl.className = "active";
                isTransitioning = false;
            };

            imgEl.onerror = function () {
                isTransitioning = false;
                advanceToNext();
            };

            imgEl.src = url;
        }

        function preloadAndShow(url) {
            var preloader = new Image();
            var done = false;

            function onDone(success) {
                if (done) { return; }
                done = true;
                if (success) {
                    showImage(url);
                } else {
                    isTransitioning = false;
                    advanceToNext();
                }
            }

            preloader.onload = function () { onDone(true); };
            preloader.onerror = function () { onDone(false); };

            preloader.src = url;

            window.setTimeout(function () {
                if (!done) { onDone(false); }
            }, 15000);
        }

        function advanceToNext() {
            if (assets.length === 0) { return; }
            if (isTransitioning) { return; }
            isTransitioning = true;
            currentIndex = (currentIndex + 1) % assets.length;
            preloadAndShow(getThumbUrl(assets[currentIndex]));
        }

        function startSlideshow() {
            if (assets.length === 0) { return; }

            isTransitioning = true;
            preloadAndShow(getThumbUrl(assets[0]));

            window.setInterval(function () {
                advanceToNext();
            }, intervalSec * 1000);
        }

        function fetchJSON(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            callback(null, data);
                        } catch (e) {
                            callback("parse error");
                        }
                    } else {
                        callback("http error");
                    }
                }
            };
            xhr.onerror = function () { callback("network error"); };
            xhr.ontimeout = function () { callback("timeout"); };
            xhr.open("GET", url, true);
            xhr.timeout = 15000;
            xhr.send(null);
        }

        function init() {
            updateClock();
            window.setInterval(updateClock, 1000);

            fetchJSON("/api/slideshow", function (err, data) {
                if (err) { return; }

                assets = data.assets || [];
                intervalSec = data.interval || 15;

                startSlideshow();
            });
        }

        if (document.readyState === "complete" || document.readyState === "interactive") {
            window.setTimeout(init, 0);
        } else {
            document.addEventListener("DOMContentLoaded", init);
        }

    })();
    </script>
</body>
</html>
