<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimal-ui">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Immich Frame">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Immich Frame">
    <meta name="theme-color" content="#000000">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="full-screen" content="yes">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="apple-touch-icon" href="/static/icon.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/static/icon-120.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/static/icon-152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/static/icon-167.png">
    <title>Immich Frame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: {{ secondary_color|default('#000000') }};
            font-family: -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
        }

        #slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: {{ secondary_color|default('#000000') }};
        }

        /* Single image (normal mode) */
        .slide-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        .slide-img.active {
            display: block;
        }

        /* Split screen (two portrait photos side by side) */
        #split-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            -webkit-flex-direction: row;
            flex-direction: row;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
        }

        #split-container.active {
            display: -webkit-flex;
            display: flex;
        }

        .split-half {
            width: 50%;
            height: 100%;
            -webkit-flex: 1 1 0;
            flex: 1 1 0;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            overflow: hidden;
        }

        .split-half img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #split-gap {
            width: 4px;
            height: 100%;
            background-color: #000;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
        }

        /* Navigation arrows / pause button */
        .nav-arrow, #nav-pause {
            position: fixed;
            top: 50%;
            -webkit-transform: translateY(-50%);
            transform: translateY(-50%);
            width: 50px;
            height: 80px;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            opacity: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-arrow:hover, #nav-pause:hover {
            opacity: 1 !important;
        }

        #nav-prev { left: 10px; }
        #nav-next { right: 10px; }
        #nav-pause { left: 50%; -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%); width: 60px; }

        .nav-arrow svg, #nav-pause svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: {{ primary_color|default('#f5deb3') }};
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-arrow:hover svg, #nav-pause:hover svg {
            stroke: #fff;
        }

        #nav-pause.paused svg {
            stroke: #fff;
        }

        /* Progress bar */
        #progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: {{ primary_color|default('#f5deb3') }};
            z-index: 100;
        }

        /* Bottom left - Clock and date */
        #bottom-left {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 50;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            pointer-events: none;
            text-align: left;
            white-space: nowrap;
        }

        #clock-date {
            color: {{ primary_color|default('#f5deb3') }};
            font-family: Helvetica, Arial, sans-serif;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            margin-top: 4px;
            margin-bottom: 0;
            white-space: nowrap;
        }

        #clock {
            color: {{ primary_color|default('#f5deb3') }};
            font-family: Helvetica, Arial, sans-serif;
            font-size: 64px;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        /* Weather */
        #weather {
            color: {{ primary_color|default('#f5deb3') }};
            font-family: Helvetica, Arial, sans-serif;
            font-size: 16px;
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            margin-top: 0;
            margin-bottom: 10px;
            display: none;
            -webkit-flex-direction: row;
            flex-direction: row;
            -webkit-align-items: center;
            align-items: center;
        }

        #weather.visible {
            display: -webkit-flex;
            display: flex;
        }

        #weather-icon-wrap {
            width: 40px;
            height: 40px;
            margin-right: 10px;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
        }

        #weather-icon-wrap svg {
            width: 40px;
            height: 40px;
            display: block;
        }

        #weather-info {
            -webkit-flex: 1;
            flex: 1;
        }

        #weather-temp {
            font-size: 20px;
            font-weight: 300;
        }

        #weather-desc {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 2px;
        }

        #weather-minmax {
            font-size: 13px;
            opacity: 0.75;
            margin-top: 2px;
        }

        /* Bottom right - Photo info */
        #bottom-right {
            position: fixed;
            bottom: 20px;
            right: 20px;
            text-align: left;
            color: {{ primary_color|default('#f5deb3') }};
            font-size: {{ base_font_size|default('17px') }};
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            z-index: 50;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            pointer-events: none;
            max-width: 50%;
        }

        .info-row {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: flex-start;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-icon {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            margin-top: 2px;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
            opacity: 0.9;
        }

        .info-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: {{ primary_color|default('#f5deb3') }};
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #info-album { font-size: 1em; font-weight: 400; }
        #info-people { font-size: 1em; }
        #info-location { font-size: 0.95em; opacity: 0.9; }
        #info-date { font-size: 0.9em; opacity: 0.8; }
        #info-desc {
            font-size: 0.9em;
            opacity: 0.85;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Memory badge */
        #memory-badge {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 60;
            display: none;
            background-color: rgba(0, 0, 0, 0.55);
            border: 1px solid {{ primary_color|default('#f5deb3') }};
            color: {{ primary_color|default('#f5deb3') }};
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 16px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            pointer-events: none;
        }

        #memory-badge.active {
            display: block;
        }

        /* Pause indicator */
        #pause-indicator {
            position: fixed;
            top: 20px;
            left: 50%;
            -webkit-transform: translateX(-50%);
            transform: translateX(-50%);
            z-index: 60;
            display: none;
            background-color: rgba(0, 0, 0, 0.55);
            border: 1px solid {{ primary_color|default('#f5deb3') }};
            border-radius: 50%;
            width: 44px;
            height: 44px;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            pointer-events: none;
        }

        #pause-indicator.active {
            display: -webkit-flex;
            display: flex;
        }

        #pause-indicator svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: {{ primary_color|default('#f5deb3') }};
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Keep screen awake */
        #keep-awake {
            position: fixed;
            top: -10px;
            left: -10px;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            z-index: -1;
        }

        /* Software brightness dimmer.
           z-index 90 dims photos/clock/weather/info (50) but keeps the gear,
           arrows and progress bar (100), settings menu (200), night overlay
           (9999) and error overlay (10000) fully readable. */
        #dimmer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            pointer-events: none;
            z-index: 90;
            opacity: 0;
            display: none;
        }

        /* Night mode overlay */
        #night-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 9999;
            display: none;
        }

        #night-overlay.active {
            display: block;
        }

        /* Error overlay */
        #error-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 10000;
            display: none;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: center;
            align-items: center;
        }

        #error-overlay.active {
            display: -webkit-flex;
            display: flex;
        }

        #error-message {
            color: {{ primary_color|default('#f5deb3') }};
            font-family: Helvetica, Arial, sans-serif;
            font-size: 24px;
            text-align: center;
        }

        /* Settings gear icon */
        #settings-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            z-index: 100;
            opacity: 0;
            -webkit-tap-highlight-color: transparent;
        }

        #settings-btn:hover {
            opacity: 1 !important;
        }

        #settings-btn svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: {{ primary_color|default('#f5deb3') }};
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Settings menu */
        #settings-menu {
            position: fixed;
            top: 70px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.9);
            border: 1px solid {{ primary_color|default('#f5deb3') }};
            border-radius: 8px;
            padding: 15px;
            z-index: 200;
            display: none;
            min-width: 200px;
        }

        #settings-menu.active {
            display: block;
        }

        .settings-title {
            color: {{ primary_color|default('#f5deb3') }};
            font-family: Helvetica, Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid {{ primary_color|default('#f5deb3') }};
            padding-bottom: 10px;
        }

        .settings-item {
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-align-items: center;
            align-items: center;
            padding: 8px 0;
            color: {{ primary_color|default('#f5deb3') }};
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
        }

        .settings-toggle {
            position: relative;
            width: 44px;
            height: 24px;
            background: #333;
            border-radius: 12px;
            cursor: pointer;
        }

        .settings-toggle.on {
            background: {{ primary_color|default('#f5deb3') }};
        }

        .settings-toggle::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
        }

        .settings-toggle.on::after {
            -webkit-transform: translateX(20px);
            transform: translateX(20px);
        }

        /* Brightness touch controls */
        .brightness-control {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
        }

        .brightness-btn {
            width: 28px;
            height: 24px;
            line-height: 22px;
            padding: 0;
            text-align: center;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 16px;
            background-color: transparent;
            color: {{ primary_color|default('#f5deb3') }};
            border: 1px solid {{ primary_color|default('#f5deb3') }};
            border-radius: 4px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #brightness-value {
            display: inline-block;
            min-width: 46px;
            text-align: center;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
            color: {{ primary_color|default('#f5deb3') }};
        }
    </style>
</head>

        </div>

    <script>
    (function () {
        // ---- Element references (only ES5 DOM APIs) ----
        var imgSingle = document.getElementById("img-single");
        var imgLeft = document.getElementById("img-left");
        var imgRight = document.getElementById("img-right");
        var splitContainer = document.getElementById("split-container");

        // ---- Clock helpers (UTC based fix — DO NOT change) ----
        function padZero(n) {

        // ---- Software brightness dimmer ----
        // opacity = (100 - levelPercent) / 100. The overlay is hidden at 100%.
        function applyDimmer(levelPercent) {
            if (!dimmerOverlay) return;
            if (levelPercent >= 100) {
                dimmerOverlay.style.display = "none";
                dimmerOverlay.style.opacity = "0";

                var opacity = (100 - levelPercent) / 100;
                dimmerOverlay.style.display = "block";
                dimmerOverlay.style.opacity = String(opacity);
            }
        }

        function clampBrightness(value) {
            value = parseInt(value, 10);
            if (isNaN(value)) return 100;
            if (value < 10) return 10;
            if (value > 100) return 100;
            return value;
        }

        function updateBrightnessUI() {
            if (brightnessValue) brightnessValue.innerHTML = currentBrightness + "%";
        }

        // Start from the server-configured value; a manual adjustment saved in
        // localStorage takes precedence so the user's choice survives reloads.
        function initBrightness() {
            currentBrightness = clampBrightness(config.brightness);
            try {
                var stored = localStorage.getItem("brightness");
                if (stored !== null) {
                    var v = parseInt(stored, 10);
                    if (!isNaN(v) && v >= 10 && v <= 100) {
                        currentBrightness = v;
                    }
                }
            } catch (e) {}
            updateBrightnessUI();
        }

        // Touch controls: adjust in steps of 10 between 10 and 100. Only a
        // manual adjustment is persisted to localStorage.
        window.adjustBrightness = function (delta) {
            currentBrightness = clampBrightness(currentBrightness + delta);
            try {
                localStorage.setItem("brightness", String(currentBrightness));
            } catch (e) {}
            updateBrightnessUI();
            updateNightMode();
        };

        // True when night mode is active but still showing a dimmed slideshow.
        function nightModeDimmed() {
            if (!isNightMode()) return false;
            // 0 means full black overlay; any value above 0 keeps the
            // slideshow running with the software dimmer applied.
            var raw = parseInt(config.nightModeBrightness, 10);
            if (isNaN(raw)) raw = 0;
            return raw > 0;
        }

        // Resume timers only when the user has not manually paused the frame.
        function resumeSlideshowIfActive() {
            if (!isPaused && !intervals.slide && !intervals.slideResume &&
                assets.length > 0 && !isTransitioning) {
                startSlideTimer();
                if (!intervals.progress) startProgress();
            }
        }

        function isNightMode() {
            if (!config.nightMode) return false;

            var now = getServerTime();
            var currentMinutes;
            if (serverTimeOffset !== null) {
                currentMinutes = now.getUTCHours() * 60 + now.getUTCMinutes();
            } else {
                currentMinutes = (now.getHours() * 60) + now.getMinutes();
            }

            var startParts = (config.nightModeStart || "22:00").split(":");
            var startMinutes = parseInt(startParts[0], 10) * 60 + parseInt(startParts[1], 10);

            var endParts = (config.nightModeEnd || "07:00").split(":");
            var endMinutes = parseInt(endParts[0], 10) * 60 + parseInt(endParts[1], 10);

            if (startMinutes > endMinutes) {
                return currentMinutes >= startMinutes || currentMinutes < endMinutes;
            } else {
                return currentMinutes >= startMinutes && currentMinutes < endMinutes;
            }
        }

        function getLanguage() {
            return config.language || "pt";
        }

        function getDateNames(lang) {
            var days, months;
            if (lang === "en") {
                days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
                months = ["January", "February", "March", "April", "May", "June",
                          "July", "August", "September", "October", "November", "December"];
            } else if (lang === "es") {
                days = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
                months = ["enero", "febrero", "marzo", "abril", "mayo", "junio",
                          "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
            } else if (lang === "fr") {
                days = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
                months = ["janvier", "février", "mars", "avril", "mai", "juin",
                          "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
            } else if (lang === "de") {
                days = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
                months = ["Januar", "Februar", "März", "April", "Mai", "Juni",
                          "Juli", "August", "September", "Oktober", "November", "Dezember"];
            } else {
                days = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
                months = ["janeiro", "fevereiro", "março", "abril", "maio", "junho",
                          "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
            }
            return { days: days, months: months };
        }

        // ES5 token formatter: eeee, d, dd, MMMM, MM, yyyy + 'literal' text.
        function formatDateTokens(fmt, values) {
            var out = "";
            var i = 0;
            while (i < fmt.length) {
                var ch = fmt.charAt(i);
                if (ch === "'") {
                    i++;
                    var literal = "";
                    while (i < fmt.length && fmt.charAt(i) !== "'") {
                        literal += fmt.charAt(i);
                        i++;
                    }
                    if (i < fmt.length) i++;
                    out += literal;
                    continue;
                }
                if (fmt.substr(i, 4) === "eeee") { out += values.eeee; i += 4; continue; }
                if (fmt.substr(i, 4) === "MMMM") { out += values.MMMM; i += 4; continue; }
                if (fmt.substr(i, 4) === "yyyy") { out += values.yyyy; i += 4; continue; }
                if (fmt.substr(i, 2) === "dd") { out += values.dd; i += 2; continue; }
                if (fmt.substr(i, 2) === "MM") { out += values.MM; i += 2; continue; }
                if (ch === "d") { out += values.d; i++; continue; }
                out += ch;
                i++;
            }
            return out;
        }

        // Photo date: prefer the backend-provided formattedDate, otherwise parse manually.
        function formatDate(asset, format) {
            if (!asset) return "";
            if (asset.formattedDate) return asset.formattedDate;

            var dateStr = asset.date || "";
            if (!dateStr) return "";

            var year, month, day, dayIdx;
            var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(dateStr);
            if (m) {
                year = parseInt(m[1], 10);
                month = parseInt(m[2], 10) - 1;
                day = parseInt(m[3], 10);
                // Date.UTC + getUTCDay avoids timezone/Invalid Date bugs on iOS 9.
                dayIdx = (new Date(Date.UTC(year, month, day))).getUTCDay();
            } else {
                var d = new Date(dateStr);
                if (isNaN(d.getTime())) return "";
                year = d.getFullYear();
                month = d.getMonth();
                day = d.getDate();
                dayIdx = d.getDay();
            }

            var names = getDateNames(getLanguage());
            var values = {
                eeee: names.days[dayIdx],
                MMMM: names.months[month],
                yyyy: "" + year,
                dd: day < 10 ? "0" + day : "" + day,
                d: "" + day,
                MM: (month + 1) < 10 ? "0" + (month + 1) : "" + (month + 1)
            };
            return formatDateTokens(format || "dd/MM/yyyy", values);
        }

        function updateClock() {
            if (!config.showClock) {
                if (clockEl) clockEl.style.display = "none";
                if (clockDateEl) clockDateEl.style.display = "none";
                return;
            }

            if (clockEl) clockEl.style.display = "";
            if (clockDateEl) clockDateEl.style.display = "";

            var now = getServerTime();
            var h, m, s, dayIdx, dateNum, monthIdx, year;

            if (serverTimeOffset !== null) {
                h = padZero(now.getUTCHours());
                m = padZero(now.getUTCMinutes());
                s = padZero(now.getUTCSeconds());
                dayIdx = now.getUTCDay();
                dateNum = now.getUTCDate();
                monthIdx = now.getUTCMonth();
                year = now.getUTCFullYear();
            } else {
                h = padZero(now.getHours());
                m = padZero(now.getMinutes());
                s = padZero(now.getSeconds());
                dayIdx = now.getDay();
                dateNum = now.getDate();
                monthIdx = now.getMonth();
                year = now.getFullYear();
            }

            var clockText = config.clockFormat || "HH:mm";
            clockText = clockText.replace("HH", h).replace("mm", m).replace("ss", s);
            if (clockEl) { clockEl.innerHTML = clockText; }

            if (clockDateEl) {
                var lang = getLanguage();
                var names = getDateNames(lang);
                var defaultFmt = "eeee, d 'de' MMMM 'de' yyyy";
                if (lang === "en") defaultFmt = "eeee, d MMMM yyyy";
                else if (lang === "fr") defaultFmt = "eeee d MMMM yyyy";
                else if (lang === "de") defaultFmt = "eeee, d. MMMM yyyy";
                var fmt = config.clockDateFormat || defaultFmt;
                clockDateEl.innerHTML = formatDateTokens(fmt, {
                    eeee: names.days[dayIdx],
                    MMMM: names.months[monthIdx],
                    yyyy: "" + year,
                    dd: dateNum < 10 ? "0" + dateNum : "" + dateNum,
                    d: "" + dateNum,
                    MM: (monthIdx + 1) < 10 ? "0" + (monthIdx + 1) : "" + (monthIdx + 1)
                });
            }
        }

        function fetchServerTime() {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (typeof data.year === "number" && typeof data.month === "number" && typeof data.day === "number") {
                            // Virtual UTC timestamp: decouples the clock from the device timezone.
                            var targetMs = Date.UTC(data.year, data.month - 1, data.day, data.hour, data.minute, data.second || 0);
                            var clientNow = (new Date()).getTime();
                            serverTimeOffset = targetMs - clientNow;
                            updateClock();
                            updateNightMode();
                        }
                    } catch (e) {}
                }
            };
            xhr.open("GET", "/api/time", true);
            xhr.timeout = 5000;
            xhr.send(null);
        }

        function getServerTime() {
            var clientMs = (new Date()).getTime();
            if (serverTimeOffset !== null) {
                return new Date(clientMs + serverTimeOffset);
            }
            return new Date(clientMs);
        }

        // ---- Inline SVG weather icons (no external PNG) ----
        function svgSun(cx, cy, r) {
            var out = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"></circle>';
            for (var i = 0; i < 8; i++) {
                var a = i * Math.PI / 4;
                var x1 = (cx + Math.cos(a) * (r + 3)).toFixed(1);
                var y1 = (cy + Math.sin(a) * (r + 3)).toFixed(1);
                var x2 = (cx + Math.cos(a) * (r + 8)).toFixed(1);
                var y2 = (cy + Math.sin(a) * (r + 8)).toFixed(1);
                out += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"></line>';
            }
            return out;
        }

        function svgMoon(cx, cy, r) {
            return '<path d="M ' + (cx + r * 0.5) + ' ' + (cy - r) +
                   ' A ' + r + ' ' + r + ' 0 1 0 ' + (cx + r * 0.5) + ' ' + (cy + r) +
                   ' A ' + (r * 0.8) + ' ' + (r * 0.8) + ' 0 1 1 ' + (cx + r * 0.5) + ' ' + (cy - r) + ' Z"></path>';
        }

        function svgCloud(y) {
            return '<path d="M16 ' + (y + 16) + ' a9 9 0 0 1 9 -9 a13 13 0 0 1 25 2 a9 9 0 0 1 -2 17 H24 a8 8 0 0 1 -8 -10 Z"></path>';
        }

        function svgRain(y) {
            var out = "";
            var xs = [24, 34, 44];
            for (var i = 0; i < xs.length; i++) {
                out += '<line x1="' + xs[i] + '" y1="' + (y + 34) + '" x2="' + (xs[i] - 3) + '" y2="' + (y + 42) + '"></line>';
            }
            return out;
        }

        function svgSnow(y) {
            var out = "";
            var xs = [24, 34, 44];
            for (var i = 0; i < xs.length; i++) {
                var cx = xs[i];
                var cy = y + 38;
                out += '<line x1="' + (cx - 4) + '" y1="' + cy + '" x2="' + (cx + 4) + '" y2="' + cy + '"></line>';
                out += '<line x1="' + cx + '" y1="' + (cy - 4) + '" x2="' + cx + '" y2="' + (cy + 4) + '"></line>';
            }
            return out;
        }

        function svgFog(y) {
            var out = "";
            var ys = [y + 34, y + 40, y + 46];
            for (var i = 0; i < ys.length; i++) {
                out += '<line x1="16" y1="' + ys[i] + '" x2="48" y2="' + ys[i] + '"></line>';
            }
            return out;
        }

        function getWeatherSvg(iconId) {
            var code = iconId || "01d";
            if (code.length >= 3 && code.charAt(2) === "@") code = code.substr(0, 2) + code.charAt(3);
            if (code.length > 3) code = code.substring(0, 3);
            var night = code.charAt(2) === "n";
            var base = code.substring(0, 2);
            var body = "";

            if (base === "01") {
                body = night ? svgMoon(32, 32, 13) : svgSun(32, 32, 11);
            } else if (base === "02") {
                body = (night ? svgMoon(24, 22, 8) : svgSun(24, 22, 7)) + svgCloud(24);
            } else if (base === "03" || base === "04") {
                body = svgCloud(20);
                if (base === "04") body += svgCloud(30);
            } else if (base === "09" || base === "10") {
                body = svgCloud(14);
                if (base === "10") body += night ? svgMoon(20, 18, 7) : svgSun(20, 18, 7);
                body += svgRain(18);
            } else if (base === "11") {
                body = svgCloud(14) + '<polygon points="32,36 26,48 31,48 29,56 40,43 34,43 37,36"></polygon>';
            } else if (base === "13") {
                body = svgCloud(14) + svgSnow(18);
            } else if (base === "50") {
                body = svgCloud(16) + svgFog(16);
            } else {
                body = night ? svgMoon(32, 32, 13) : svgSun(32, 32, 11);
            }

            return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40" ' +
                   'fill="none" stroke="' + themeStroke + '" stroke-width="2.5" ' +
                   'stroke-linecap="round" stroke-linejoin="round">' + body + '</svg>';
        }

        function renderWeatherIcon(iconId) {
            lastWeatherIcon = iconId || "01d";
            if (weatherWrap) weatherWrap.innerHTML = getWeatherSvg(lastWeatherIcon);
        }

        function fetchWeather() {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            if (data.enabled && !data.error) {
                                var iconId = data.iconId;
                                if (!iconId && data.iconUrl) {
                                    var parts = data.iconUrl.split("/");
                                    iconId = parts[parts.length - 1].replace(".png", "");
                                }
                                renderWeatherIcon(iconId);

                                weatherTemp.innerHTML = data.city + ", " + data.temp + data.unit;

                                if (config.showWeatherDescription !== false && data.description) {
                                    weatherDesc.innerHTML = data.description;
                                    weatherDesc.style.display = "";
                                } else {
                                    weatherDesc.innerHTML = "";
                                    weatherDesc.style.display = "none";
                                }

                                if (config.showWeatherExtended !== false &&
                                    data.tempMin !== undefined && data.tempMax !== undefined) {
                                    weatherMinMax.innerHTML = "↓" + Math.round(data.tempMin) + "° ↑" + Math.round(data.tempMax) + "°";
                                    weatherMinMax.style.display = "";
                                } else {
                                    weatherMinMax.innerHTML = "";
                                    weatherMinMax.style.display = "none";
                                }

                                weatherEl.className = "visible";
                            } else {
                                weatherEl.className = "";
                            }
                        } catch (e) {
                            weatherEl.className = "";
                        }
                    } else {
                        weatherEl.className = "";
                    }
                }
            };
            xhr.onerror = function () { weatherEl.className = ""; };
            xhr.open("GET", "/api/weather", true);
            xhr.timeout = 10000;
            xhr.send(null);
        }

        // ---- Runtime theme (Jinja values are the CSS defaults) ----
        function applyConfig() {
            if (config.primaryColor) {

            var albumRow = document.getElementById("info-album-row");
            var peopleRow = document.getElementById("info-people-row");

            if (!config.showAlbumName && albumRow) albumRow.style.display = "none";
            if (!config.showPeopleDesc && peopleRow) peopleRow.style.display = "none";
            if (!config.showImageLocation && locationRow) locationRow.style.display = "none";
            if (!config.showPhotoDate && dateRow) dateRow.style.display = "none";
        }

        function joinInfo(a, b) {
            if (!b) return a || "";
            if (!a) return b;
            if (a === b) return a;
            return a + " \u2022 " + b;
        }

        function memoryLabel(yearsAgo) {
            var n = parseInt(yearsAgo, 10);
            var lang = getLanguage();
            if (lang === "en") return n === 1 ? "1 year ago" : n + " years ago";
            if (lang === "es") return n === 1 ? "Hace 1 año" : "Hace " + n + " años";
            if (lang === "fr") return n === 1 ? "Il y a 1 an" : "Il y a " + n + " ans";
            if (lang === "de") return n === 1 ? "Vor 1 Jahr" : "Vor " + n + " Jahren";
            return n === 1 ? "Há 1 ano" : "Há " + n + " anos";
        }

        function updateInfo(asset, asset2) {
            displayAsset = asset || null;
            displayAsset2 = asset2 || null;

            var albumRow = document.getElementById("info-album-row");
            var peopleRow = document.getElementById("info-people-row");
            var locationRow = document.getElementById("info-location-row");
            var dateRow = document.getElementById("info-date-row");
            var descRow = document.getElementById("info-desc-row");

            if (!asset) return;

            var album = joinInfo(asset.albumName, asset2 && asset2.albumName);
            if (config.showAlbumName && album) {
                infoAlbum.innerHTML = album;
                if (albumRow) albumRow.style.display = "";
            } else {
                infoAlbum.innerHTML = "";
                if (albumRow) albumRow.style.display = "none";
            }

            var peopleA = asset.people && asset.people.length ? asset.people.join(", ") : "";
            var peopleB = asset2 && asset2.people && asset2.people.length ? asset2.people.join(", ") : "";
            var people = joinInfo(peopleA, peopleB);
            if (config.showPeopleDesc && people) {
                infoPeople.innerHTML = people;
                if (peopleRow) peopleRow.style.display = "";
            } else {
                infoPeople.innerHTML = "";
                if (peopleRow) peopleRow.style.display = "none";
            }

            var location = joinInfo(asset.location, asset2 && asset2.location);
            if (config.showImageLocation && location) {
                infoLocation.innerHTML = location;
                if (locationRow) locationRow.style.display = "";
            } else {
                infoLocation.innerHTML = "";
                if (locationRow) locationRow.style.display = "none";
            }

            if (config.showPhotoDate && (asset.date || (asset2 && asset2.date))) {
                var fmt = config.photoDateFormat || "dd/MM/yyyy";
                var dateA = formatDate(asset, fmt);
                var dateB = asset2 ? formatDate(asset2, fmt) : "";
                infoDate.innerHTML = joinInfo(dateA, dateB);
                if (dateRow) dateRow.style.display = "";
            } else {
                infoDate.innerHTML = "";
                if (dateRow) dateRow.style.display = "none";
            }

            var descA = asset.description || "";
            var descB = asset2 ? (asset2.description || "") : "";
            var desc = joinInfo(descA, descB);
            if (config.showImageDesc && desc) {
                infoDesc.innerHTML = desc;
                if (descRow) descRow.style.display = "";
            } else {
                infoDesc.innerHTML = "";
                if (descRow) descRow.style.display = "none";
            }

            // "On this day" badge refers to the current (first) asset.
            if (config.showMemories !== false && asset.isMemory && asset.yearsAgo > 0) {
                memoryBadge.innerHTML = memoryLabel(asset.yearsAgo);
                memoryBadge.className = "active";
            } else {
                memoryBadge.innerHTML = "";
                memoryBadge.className = "";
            }
        }

        // ---- Timer management ----
        function clearSlideTimer() {
            if (intervals.slide) {
                window.clearInterval(intervals.slide);
                intervals.slide = null;
            }
            if (intervals.slideResume) {
                window.clearTimeout(intervals.slideResume);
                intervals.slideResume = null;
            }
        }

        function startSlideTimer(delayMs) {
            clearSlideTimer();
            if (isPaused || (isNightMode() && !nightModeDimmed()) || assets.length === 0) return;

            var duration = (config.interval || 20) * 1000;
            if (delayMs && delayMs > 50) {
                intervals.slideResume = window.setTimeout(function () {
                    intervals.slideResume = null;
                    advanceToNext();
                }, delayMs);
            } else {
                intervals.slide = window.setInterval(function () {
                    advanceToNext();
                }, duration);
            }
        }

        function stopProgress() {
            if (intervals.progress) {
                window.clearInterval(intervals.progress);
                intervals.progress = null;
            }
            progressWidth = 0;
            if (progressBar) progressBar.style.width = "0%";
        }

        function startProgress() {
            if (intervals.progress) {
                window.clearInterval(intervals.progress);
                intervals.progress = null;
            }
            progressWidth = 0;
            progressBar.style.width = "0%";
            // 500ms ticks: 100 / ((interval||20) * 2) = 2.5% per tick at 20s
            // -> exactly 40 ticks = 100% at the right time, 5x fewer repaints.
            intervals.progress = window.setInterval(function () {
                if (isPaused === true) return; // freeze while paused
                progressWidth += 100 / ((config.interval || 20) * 2);
                if (progressWidth >= 100) {
                    progressWidth = 100;
                    window.clearInterval(intervals.progress);
                    intervals.progress = null;
                }
                progressBar.style.width = progressWidth + "%";
            }, 500);
        }

        function togglePause() {
            isPaused = !isPaused;
            var duration = (config.interval || 20) * 1000;

            if (isPaused) {
                pausedRemainingMs = Math.max(0, duration * (1 - progressWidth / 100));
                clearSlideTimer();
            } else {
                startSlideTimer(pausedRemainingMs);
                pausedRemainingMs = 0;
            }
            updatePauseUI();
        }

        function updateNightMode() {
            if (isNightMode()) {
                if (nightModeDimmed()) {
                    // Keep the slideshow visible, just dimmed to the configured level.
                    nightOverlay.className = "";
                    applyDimmer(parseInt(config.nightModeBrightness, 10));
                    resumeSlideshowIfActive();
                } else {
                    // Original behaviour: full black screen and paused slideshow.
                    nightOverlay.className = "active";
                    applyDimmer(100); // hide the dimmer under the black overlay
                    stopProgress();
                    clearSlideTimer();
                }
            } else {
                nightOverlay.className = "";
                applyDimmer(currentBrightness);
                resumeSlideshowIfActive();
            }
        }

        function getThumbUrl(assetId) {
            return "/api/thumbnail/" + assetId;
        }

        function fetchAssetDetails(assetId, callback) {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            callback(null, JSON.parse(xhr.responseText));
                        } catch (e) {
                            callback("parse error");
                        }
                    } else {
                        callback("http error");
                    }
                }
            };
            xhr.onerror = function () { callback("network error"); };
            xhr.open("GET", "/api/asset/" + assetId + "/details", true);
            xhr.timeout = 10000;
            xhr.send(null);
        }

        // Skip the extra details request when people/location already present
        // or when the details were already fetched for this asset.
        function maybeFetchDetails(asset) {
            if (!asset || !asset.id || asset.detailsFetched) return;
            if ((asset.people && asset.people.length > 0) || (asset.location && asset.location !== "")) {
                asset.detailsFetched = true;
                return;
            }
            asset.detailsFetched = true;
            fetchAssetDetails(asset.id, function (err, details) {
                if (!err && details) {
                    if (details.people && details.people.length > 0) asset.people = details.people;
                    if (details.location) asset.location = details.location;
                    updateInfo(displayAsset, displayAsset2);
                }
            });
        }

        // ---- Preloaders (released after every swap to protect low RAM) ----
        var activePreloaders = [];
        var activePreloadTimers = [];

        function cleanupPreloaders() {
            var i;
            for (i = 0; i < activePreloaders.length; i++) {
                var p = activePreloaders[i];
                p.onload = null;
                p.onerror = null;
                p.src = "";
            }
            activePreloaders = [];
            for (i = 0; i < activePreloadTimers.length; i++) {
                window.clearTimeout(activePreloadTimers[i]);
            }
            activePreloadTimers = [];
        }

        function preloadURL(url, asset, onResult) {
            var img = new Image();
            var settled = false;
            activePreloaders.push(img);

            var timer = window.setTimeout(function () { finish(false); }, 8000);
            activePreloadTimers.push(timer);

            function finish(ok) {
                if (settled) return;
                settled = true;
                window.clearTimeout(timer);
                img.onload = null;
                img.onerror = null;
                if (!ok) img.src = "";
                onResult(ok);
            }

            img.onload = function () {
                // Always refresh the orientation from the decoded thumbnail: null
                // (unknown) must be updated just like undefined, otherwise split
                // portraits silently degrade to single slides.
                if (asset && img.naturalWidth && img.naturalHeight) {
                    asset.isPortrait = img.naturalWidth < img.naturalHeight;
                }
                finish(true);
            };
            img.onerror = function () { finish(false); };
            img.src = url;
        }

        function getAssetAt(index) {
            if (assets.length === 0) return null;
            var i = index % assets.length;
            if (i < 0) i += assets.length;
            return assets[i];
        }

        function onImageDisplayed(asset, asset2) {
            isTransitioning = false;
            updateInfo(asset, asset2);
            maybeFetchDetails(asset);
            if (asset2) maybeFetchDetails(asset2);
            if (!isPaused && (!isNightMode() || nightModeDimmed())) {
                startProgress();
                startSlideTimer();
            }
        }

        function showSingle(url, asset) {
            stepSize = 1;
            splitContainer.className = "";
            imgSingle.className = "slide-img";
            var fired = false;

            function done() {
                if (fired) return;
                fired = true;
                imgSingle.className = "slide-img active";
                onImageDisplayed(asset, null);
            }

            function failed() {
                if (fired) return;
                fired = true;
                isTransitioning = false;
                advanceToNext();
            }

            imgSingle.onload = done;
            imgSingle.onerror = failed;
            imgSingle.src = url;
            // On iOS 9 a cached image can already be complete before the load
            // event is delivered (or delivered at all). Handle it explicitly.
            if (imgSingle.complete && imgSingle.naturalWidth) done();
        }

        function showSplit(urlA, urlB, assetA, assetB) {
            stepSize = 2;
            imgSingle.className = "slide-img";
            splitContainer.className = "active";
            var firedLeft = false;
            var firedRight = false;
            var displayed = false;
            var failed = false;

            function maybeDone() {
                if (failed || displayed || !firedLeft || !firedRight) return;
                displayed = true;
                onImageDisplayed(assetA, assetB);
            }

            function onError() {
                if (failed || displayed) return;
                failed = true;
                isTransitioning = false;
                advanceToNext();
            }

            function markLeft() {
                if (firedLeft || failed || displayed) return;
                firedLeft = true;
                maybeDone();
            }
            function markRight() {
                if (firedRight || failed || displayed) return;
                firedRight = true;
                maybeDone();
            }

            imgLeft.onerror = onError;
            imgRight.onerror = onError;
            imgLeft.onload = markLeft;
            imgRight.onload = markRight;
            imgLeft.src = urlA;
            imgRight.src = urlB;
            // Cached images may be complete before load handlers fire on iOS 9.
            if (imgLeft.complete && imgLeft.naturalWidth) markLeft();
            if (imgRight.complete && imgRight.naturalWidth) markRight();
        }

        // Find (and swap in) a portrait partner for the current slide. Prefers a
        // known portrait; falls back to an unknown (null) asset if none exists.
        // Search wraps around but never returns to currentIndex itself.
        function findPortraitPartnerPos() {
            if (!assets || assets.length < 2) return -1;
            var fallbackPos = -1;
            var i;
            for (i = 1; i < assets.length; i++) {
                var pos = (currentIndex + i) % assets.length;
                if (pos === currentIndex) continue;
                var candidate = assets[pos];
                if (!candidate) continue;
                if (candidate.isPortrait === true) return pos;
                if (candidate.isPortrait == null && fallbackPos < 0) fallbackPos = pos;
            }
            return fallbackPos;
        }

        function swapIntoNextPos(pos) {
            var nextPos = (currentIndex + 1) % assets.length;
            if (pos < 0 || pos === nextPos) return nextPos;
            var tmp = assets[nextPos];
            assets[nextPos] = assets[pos];
            assets[pos] = tmp;
            return nextPos;
        }

        // Used by goToIndex/startSlideshow: a known portrait must be followed by
        // another portrait so the split view can kick in immediately.
        function ensurePortraitPartner() {
            if (config.splitPortrait === false || assets.length < 2) return;
            var current = assets[currentIndex];
            var next = getAssetAt(currentIndex + 1);
            if (!current || current.isPortrait !== true || !next || next.isPortrait !== false) {
                return;
            }
            swapIntoNextPos(findPortraitPartnerPos());
        }

        // Used after preloadURL reveals that a previously unknown asset is a
        // portrait: look for another portrait and preload it for a split view.
        function trySplitWithDiscoveredPortrait(url, asset) {
            var partnerPos = findPortraitPartnerPos();
            if (partnerPos < 0) {
                showSingle(url, asset);
                return;
            }
            var nextPos = swapIntoNextPos(partnerPos);
            var partner = assets[nextPos];
            if (!partner || partner === asset) {
                showSingle(url, asset);
                return;
            }
            var partnerUrl = getThumbUrl(partner.id);
            preloadURL(partnerUrl, partner, function (ok) {
                if (ok && asset.isPortrait === true &&
                    (partner.isPortrait === true || partner.isPortrait == null)) {
                    showSplit(url, partnerUrl, asset, partner);
                } else {
                    showSingle(url, asset);
                }
            });
        }

        function preloadAndShow(url, asset, nextUrl, nextAsset) {
            cleanupPreloaders();

            var initialPortrait = asset.isPortrait;
            var splitCandidate = window.innerWidth > window.innerHeight &&
                                 config.splitPortrait !== false && assets.length > 1 &&
                                 asset.isPortrait !== false;

            if (!splitCandidate || !nextAsset) {
                preloadURL(url, asset, function (ok) {
                    if (!ok) {
                        isTransitioning = false;
                        advanceToNext();
                        return;
                    }
                    // The decoded thumbnail may reveal a portrait that was unknown.
                    if (initialPortrait == null && asset.isPortrait === true &&
                        config.splitPortrait !== false && assets.length > 1 &&
                        window.innerWidth > window.innerHeight) {
                        trySplitWithDiscoveredPortrait(url, asset);
                        return;
                    }
                    showSingle(url, asset);
                });
                return;
            }

            // Preload both thumbnails, then decide single vs. split.
            var doneA = false, doneB = false, okA = false, okB = false;

            preloadURL(url, asset, function (ok) {
                doneA = true; okA = ok; maybe();
            });
            preloadURL(nextUrl, nextAsset, function (ok) {
                doneB = true; okB = ok; maybe();
            });

            function maybe() {
                if (!doneA || !doneB) return;
                if (!okA) {
                    isTransitioning = false;
                    advanceToNext();
                    return;
                }
                // A null (unknown) asset can become a known portrait during preload.
                // If its neighbour is landscape, find another portrait to pair with.
                if (asset.isPortrait === true && nextAsset.isPortrait === false) {
                    trySplitWithDiscoveredPortrait(url, asset);
                    return;
                }
                var bothPortrait = asset.isPortrait === true && nextAsset.isPortrait === true;
                if (bothPortrait && okB) {
                    showSplit(url, nextUrl, asset, nextAsset);
                } else {
                    showSingle(url, asset);
                }
            }
        }

        function goToIndex(index) {
            clearAllIntervals();
            if (assets.length === 0 || isTransitioning) return;

            stopProgress();
            isTransitioning = true;
            pausedRemainingMs = 0;

            currentIndex = index % assets.length;
            if (currentIndex < 0) currentIndex += assets.length;

            ensurePortraitPartner();

            var asset = assets[currentIndex];
            var nextAsset = assets.length > 1 ? getAssetAt(currentIndex + 1) : null;
            var nextUrl = nextAsset ? getThumbUrl(nextAsset.id) : null;

            // The timer is (re)started in onImageDisplayed so the chosen photo
            // always gets its full time on screen after a manual navigation.
            preloadAndShow(getThumbUrl(asset.id), asset, nextUrl, nextAsset);
        }

        function startSlideshow() {
            if (assets.length === 0) return;
            isTransitioning = true;
            currentIndex = 0;

            ensurePortraitPartner();

            var asset = assets[0];
            var nextAsset = assets.length > 1 ? getAssetAt(1) : null;
            var nextUrl = nextAsset ? getThumbUrl(nextAsset.id) : null;
            preloadAndShow(getThumbUrl(asset.id), asset, nextUrl, nextAsset);
        }

        function advanceToNext() {
            goToIndex(currentIndex + stepSize);
        }

        window.prevImage = function () { goToIndex(currentIndex - stepSize); };
        window.nextImage = function () { goToIndex(currentIndex + stepSize); };
        window.togglePause = togglePause;

        function fetchJSON(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            callback(null, JSON.parse(xhr.responseText));
                        } catch (e) {
                            callback("parse error");
                        }
                    } else {
                        callback("http error");
                    }
                }
            };
            xhr.onerror = function () { callback("network error"); };
            xhr.ontimeout = function () { callback("timeout"); };
            xhr.open("GET", url, true);
            xhr.timeout = 15000;
            xhr.send(null);
        }

        function shuffleArray(arr) {
            for (var i = arr.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = arr[i];
                arr[i] = arr[j];
                arr[j] = temp;
            }
        }

        // Group known portraits into adjacent pairs and interleave those pairs
        // with landscape/unknown photos so a portrait is always followed by a
        // partner (split view). Memory priority is preserved when active.
        function pairPortraitAssets(list) {
            if (!list || list.length < 2) return list;

            function pairGroup(items) {
                var portraits = [];
                var others = [];
                var i;
                for (i = 0; i < items.length; i++) {
                    if (items[i] && items[i].isPortrait === true) portraits.push(items[i]);
                    else others.push(items[i]);
                }
                if (portraits.length < 2) return items;

                var result = [];
                var p = 0;
                var o = 0;
                while (o < others.length || p < portraits.length) {
                    if (o < others.length) {
                        result.push(others[o]);
                        o++;
                    }
                    if (p + 1 < portraits.length) {
                        result.push(portraits[p]);
                        result.push(portraits[p + 1]);
                        p += 2;
                    } else if (p < portraits.length) {
                        // Odd leftover: keep it attached to the pair sequence.
                        result.push(portraits[p]);
                        p++;
                    }
                }
                return result;
            }

            if (!config.prioritizeMemories) {
                return pairGroup(list);
            }

            var memories = [];
            var normal = [];
            for (var i = 0; i < list.length; i++) {
                if (list[i] && list[i].isMemory) memories.push(list[i]);
                else normal.push(list[i]);
            }
            return pairGroup(memories).concat(pairGroup(normal));
        }

        function prepareAssets() {
            if (config.shuffle && assets.length >= 2) {
                if (config.prioritizeMemories) {
                    var memories = [];
                    var normal = [];
                    for (var i = 0; i < assets.length; i++) {
                        if (assets[i].isMemory) memories.push(assets[i]);
                        else normal.push(assets[i]);
                    }
                    shuffleArray(memories);
                    shuffleArray(normal);
                    assets = memories.concat(normal);
                } else {
                    shuffleArray(assets);
                }
            }
            if (config.splitPortrait !== false) {
                assets = pairPortraitAssets(assets);
            }
        }

        function scheduleReconnect() {
            if (reconnectTimer) return; // never stack retry timers
            reconnectTimer = window.setTimeout(function () {
                reconnectTimer = null;
                loadSlideshowData();
            }, 15000);
        }

        function loadSlideshowData() {
            fetchJSON("/api/slideshow", function (err, data) {
                if (err) {
                    errorOverlay.className = "active";
                    scheduleReconnect();
                    return;
                }

                if (reconnectTimer) {
                    window.clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                errorOverlay.className = "";

                assets = data.assets || [];
                config = data.config || {};

                initLocalSettings();
                initBrightness();
                prepareAssets();
                applyLocalSettings();
                applyConfig();
                updatePauseUI();
                updateNightMode();
                if (!isNightMode() || nightModeDimmed()) startSlideshow();
            });
        }

        // ---- Gestures: swipe, double tap, keyboard ----
        function isCentralArea(x, y) {
            var w = window.innerWidth;
            var h = window.innerHeight;
            return x > w * 0.25 && x < w * 0.75 && y > h * 0.25 && y < h * 0.75;
        }

        function setupGestures() {
            var startX = 0, startY = 0, lastTap = 0;

            slideshow.addEventListener("touchstart", function (e) {
                if (!e.touches || e.touches.length !== 1) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, false);

            slideshow.addEventListener("touchend", function (e) {
                if (!e.changedTouches || e.changedTouches.length !== 1) return;
                var diffX = e.changedTouches[0].clientX - startX;
                var diffY = e.changedTouches[0].clientY - startY;
                var now = (new Date()).getTime();

                if (diffX < -50 && Math.abs(diffX) > Math.abs(diffY)) {
                    lastTap = 0;
                    nextImage();
                    return;
                }
                if (diffX > 50 && Math.abs(diffX) > Math.abs(diffY)) {
                    lastTap = 0;
                    prevImage();
                    return;
                }

                // Double tap (<350ms) in the central area toggles pause.
                if (Math.abs(diffX) < 20 && Math.abs(diffY) < 20 && isCentralArea(startX, startY)) {
                    if ((now - lastTap) < 350) {
                        togglePause();
                        lastTap = 0;
                    } else {
                        lastTap = now;
                    }
                } else {
                    lastTap = 0;
                }
            }, false);

            document.addEventListener("keydown", function (e) {
                var key = e.keyCode || e.which;
                if (key === 37) {
                    prevImage();
                } else if (key === 39) {
                    nextImage();
                } else if (key === 32) {
                    if (e.preventDefault) e.preventDefault();
                    togglePause();
                }
            }, false);
        }

        function showNav() {
            navPrev.style.opacity = "0.5";
            navNext.style.opacity = "0.5";
            navPause.style.opacity = "0.5";
            var settingsBtn = document.getElementById("settings-btn");
            if (settingsBtn) settingsBtn.style.opacity = "0.5";

            if (navHideTimer) window.clearTimeout(navHideTimer);
            navHideTimer = window.setTimeout(function () {
                navPrev.style.opacity = "0";
                navNext.style.opacity = "0";
                navPause.style.opacity = "0";
                if (settingsBtn) settingsBtn.style.opacity = "0";
                navHideTimer = null;
            }, 3000);
        }

        // Clear non-essential intervals. autoReload must survive photo changes
        // so the 30-minute reload is not cancelled on the first advance.
        function clearAllIntervals() {
            var keepKeys = ['slide', 'clock', 'serverTime', 'weather', 'nightMode', 'autoReload'];
            for (var key in intervals) {
                if (intervals[key] && keepKeys.indexOf(key) === -1) {
                    window.clearInterval(intervals[key]);
                    intervals[key] = null;
                }
            }
        }
        window.clearAllIntervals = clearAllIntervals;

        function init() {
            fetchServerTime();
            intervals.serverTime = window.setInterval(fetchServerTime, 300000);

            fetchWeather();
            intervals.weather = window.setInterval(fetchWeather, 1800000);

            updateClock();
            intervals.clock = window.setInterval(updateClock, 2000);
            intervals.nightMode = window.setInterval(updateNightMode, 60000);

            // Auto-refresh every 30 minutes; this interval is preserved by clearAllIntervals.
            intervals.autoReload = window.setInterval(function () {
                for (var key in intervals) {
                    if (intervals[key]) {
                        window.clearInterval(intervals[key]);
                        intervals[key] = null;
                    }
                }
                window.location.reload();
            }, 1800000);

            document.addEventListener("mousemove", showNav, false);
            document.addEventListener("touchstart", showNav, false);
            setupGestures();
            updatePauseUI();

            loadSlideshowData();
        }

        if (document.readyState === "complete" || document.readyState === "interactive") {
            window.setTimeout(init, 0);
        } else {
            document.addEventListener("DOMContentLoaded", init);
        }
    })();
    </script>
</body>
</html>
