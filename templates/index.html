<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimal-ui">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Immich Frame">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Immich Frame">
    <meta name="theme-color" content="#000000">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="full-screen" content="yes">
    <title>Immich Frame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            -webkit-background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
        }

        #slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #current-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #current-image.active {
            display: block;
        }

        /* Image fill mode */
        #current-image.fill {
            object-fit: cover;
        }

        /* Ken Burns zoom effect */
        @-webkit-keyframes zoomIn {
            from { -webkit-transform: scale(1); transform: scale(1); }
            to { -webkit-transform: scale(1.08); transform: scale(1.08); }
        }

        @-webkit-keyframes zoomOut {
            from { -webkit-transform: scale(1.08); transform: scale(1.08); }
            to { -webkit-transform: scale(1); transform: scale(1); }
        }

        #current-image.zoom-in {
            -webkit-animation: zoomIn 25s ease-in-out infinite alternate;
            animation: zoomIn 25s ease-in-out infinite alternate;
        }

        #current-image.zoom-out {
            -webkit-animation: zoomOut 25s ease-in-out infinite alternate;
            animation: zoomOut 25s ease-in-out infinite alternate;
        }

        /* Pan effect */
        @-webkit-keyframes panLeft {
            from { -webkit-transform: translate(0, 0); transform: translate(0, 0); }
            to { -webkit-transform: translate(-2%, 0); transform: translate(-2%, 0); }
        }

        @-webkit-keyframes panRight {
            from { -webkit-transform: translate(0, 0); transform: translate(0, 0); }
            to { -webkit-transform: translate(2%, 0); transform: translate(2%, 0); }
        }

        @-webkit-keyframes panUp {
            from { -webkit-transform: translate(0, 0); transform: translate(0, 0); }
            to { -webkit-transform: translate(0, -2%); transform: translate(0, -2%); }
        }

        @-webkit-keyframes panDown {
            from { -webkit-transform: translate(0, 0); transform: translate(0, 0); }
            to { -webkit-transform: translate(0, 2%); transform: translate(0, 2%); }
        }

        #current-image.pan-left {
            -webkit-animation: panLeft 25s ease-in-out infinite alternate;
            animation: panLeft 25s ease-in-out infinite alternate;
        }

        #current-image.pan-right {
            -webkit-animation: panRight 25s ease-in-out infinite alternate;
            animation: panRight 25s ease-in-out infinite alternate;
        }

        #current-image.pan-up {
            -webkit-animation: panUp 25s ease-in-out infinite alternate;
            animation: panUp 25s ease-in-out infinite alternate;
        }

        #current-image.pan-down {
            -webkit-animation: panDown 25s ease-in-out infinite alternate;
            animation: panDown 25s ease-in-out infinite alternate;
        }

        /* Navigation arrows */
        .nav-arrow {
            position: fixed;
            top: 50%;
            -webkit-transform: translateY(-50%);
            transform: translateY(-50%);
            width: 50px;
            height: 80px;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            opacity: 0;
            -webkit-transition: opacity 0.3s;
            transition: opacity 0.3s;
        }

        .nav-arrow:hover {
            opacity: 1 !important;
        }

        #nav-prev {
            left: 10px;
        }

        #nav-next {
            right: 10px;
        }

        .nav-arrow svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: var(--primary-color, #f5deb3);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-arrow:hover svg {
            stroke: #fff;
        }

        /* Progress bar */
        #progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 3px;
            background: var(--primary-color, #f5deb3);
            z-index: 100;
            -webkit-transition: width 0.1s linear;
            transition: width 0.1s linear;
        }

        /* Bottom left - Clock and date */
        #bottom-left {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 50;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            pointer-events: none;
            text-align: center;
        }

        #clock-date {
            color: var(--primary-color, #f5deb3);
            font-family: Helvetica, Arial, sans-serif;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            margin-bottom: 4px;
        }

        #clock {
            color: var(--primary-color, #f5deb3);
            font-family: Helvetica, Arial, sans-serif;
            font-size: 64px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        /* Weather */
        #weather {
            color: var(--primary-color, #f5deb3);
            font-family: Helvetica, Arial, sans-serif;
            font-size: 16px;
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            margin-top: 12px;
            display: none;
            -webkit-flex-direction: row;
            flex-direction: row;
            -webkit-align-items: center;
            align-items: center;
        }

        #weather.visible {
            display: -webkit-flex;
            display: flex;
        }

        #weather-icon-wrap {
            width: 40px;
            height: 40px;
            margin-right: 10px;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
        }

        #weather-icon {
            width: 40px;
            height: 40px;
            display: block;
        }

        #weather-info {
            -webkit-flex: 1;
            flex: 1;
        }

        #weather-temp {
            font-size: 20px;
            font-weight: 300;
        }

        #weather-desc {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* Bottom right - Photo info */
        #bottom-right {
            position: fixed;
            bottom: 20px;
            right: 20px;
            text-align: left;
            color: var(--primary-color, #f5deb3);
            font-size: var(--base-font-size, 17px);
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            z-index: 50;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            pointer-events: none;
            max-width: 50%;
        }

        .info-row {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: flex-start;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-icon {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            margin-top: 2px;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
            opacity: 0.9;
        }

        .info-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--primary-color, #f5deb3);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #info-album {
            font-size: 1em;
            font-weight: 400;
        }

        #info-people {
            font-size: 1em;
        }

        #info-location {
            font-size: 0.95em;
            opacity: 0.9;
        }

        #info-date {
            font-size: 0.9em;
            opacity: 0.8;
        }

        /* Keep screen awake */
        #keep-awake {
            position: fixed;
            top: -10px;
            left: -10px;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            z-index: -1;
        }
    </style>
</head>
<body>
    <!-- Keep screen awake -->
    <video id="keep-awake" loop muted playsinline>

    </video>

    <!-- Navigation arrows -->
    <div id="nav-prev" class="nav-arrow" onclick="prevImage()">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>
    <div id="nav-next" class="nav-arrow" onclick="nextImage()">
        <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"></polyline></svg>
    </div>

    <!-- Progress bar -->
    <div id="progress-bar"></div>

    <!-- Slideshow -->
    <div id="slideshow">
        <img id="current-image" alt="" draggable="false">
    </div>

    <!-- Bottom left - Clock and date -->
    <div id="bottom-left">
        <div id="clock-date"></div>
        <div id="clock"></div>
        <div id="weather">
            <div id="weather-icon-wrap"><img id="weather-icon"></div>
            <div id="weather-info">
                <div id="weather-temp"></div>
                <div id="weather-desc"></div>
            </div>
        </div>
    </div>

    <!-- Bottom right - Photo info -->
    <div id="bottom-right">
        <div class="info-row" id="info-album-row">
            <div class="info-icon"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></div>
            <div id="info-album"></div>
        </div>
        <div class="info-row" id="info-people-row">
            <div class="info-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div>
            <div id="info-people"></div>
        </div>
        <div class="info-row" id="info-location-row">
            <div class="info-icon"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></div>
            <div id="info-location"></div>
        </div>
        <div class="info-row" id="info-date-row">
            <div class="info-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></div>
            <div id="info-date"></div>
        </div>
    </div>

    <script>
    (function () {
        var imgEl = document.getElementById("current-image");
        var clockEl = document.getElementById("clock");
        var clockDateEl = document.getElementById("clock-date");
        var progressBar = document.getElementById("progress-bar");
        var infoAlbum = document.getElementById("info-album");
        var infoPeople = document.getElementById("info-people");
        var infoLocation = document.getElementById("info-location");
        var infoDate = document.getElementById("info-date");
        var navPrev = document.getElementById("nav-prev");
        var navNext = document.getElementById("nav-next");

        var assets = [];
        var config = {};
        var currentIndex = 0;
        var isTransitioning = false;
        var progressInterval = null;
        var progressWidth = 0;
        var slideInterval = null;
        var serverTimeOffset = 0;

        function padZero(n) {
            return n < 10 ? "0" + n : "" + n;
        }

        function fetchServerTime() {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        var serverNow = new Date(data.timestamp);
                        var deviceNow = new Date();
                        serverTimeOffset = serverNow.getTime() - deviceNow.getTime();
                    } catch (e) {}
                }
            };
            xhr.open("GET", "/api/time", true);
            xhr.timeout = 5000;
            xhr.send(null);
        }

        function getServerTime() {
            return new Date(Date.now() + serverTimeOffset);
        }

        function fetchWeather() {
            var weatherEl = document.getElementById("weather");
            var weatherIcon = document.getElementById("weather-icon");
            var weatherTemp = document.getElementById("weather-temp");
            var weatherDesc = document.getElementById("weather-desc");

            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            if (data.enabled && !data.error) {
                                weatherIcon.src = data.iconUrl;
                                weatherTemp.innerHTML = data.city + ", " + data.temp + data.unit;
                                if (data.description) {
                                    weatherDesc.innerHTML = data.description;
                                }
                                weatherEl.className = "visible";
                            } else {
                                weatherEl.className = "";
                            }
                        } catch (e) {
                            weatherEl.className = "";
                        }
                    } else {
                        weatherEl.className = "";
                    }
                }
            };
            xhr.onerror = function () {
                weatherEl.className = "";
            };
            xhr.open("GET", "/api/weather", true);
            xhr.timeout = 10000;
            xhr.send(null);
        }

        function formatDate(dateStr, format) {
            if (!dateStr) return "";
            var d = new Date(dateStr);
            if (isNaN(d.getTime())) return "";

            var lang = config.language || "pt";
            var days, months;
            if (lang === "en") {
                days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
                months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                          "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            } else {
                days = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sab"];
                months = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun",
                          "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
            }

            var day = d.getDate();
            var month = d.getMonth();
            var year = d.getFullYear();

            var result = format;
            result = result.replace("eeee", days[d.getDay()]);
            result = result.replace("MMMM", months[month]);
            result = result.replace("yyyy", year);
            result = result.replace(/\bdd\b/, day < 10 ? "0" + day : "" + day);
            result = result.replace(/\bd\b/, day);
            result = result.replace("MM", month + 1 < 10 ? "0" + (month + 1) : "" + (month + 1));

            result = result.replace(/'/g, "");

            return result;
        }

        function updateClock() {
            if (!config.showClock) {
                if (clockEl) clockEl.style.display = "none";
                if (clockDateEl) clockDateEl.style.display = "none";
                return;
            }

            if (clockEl) clockEl.style.display = "";
            if (clockDateEl) clockDateEl.style.display = "";

            var now = getServerTime();
            var h = padZero(now.getHours());
            var m = padZero(now.getMinutes());
            var s = padZero(now.getSeconds());

            var clockText = config.clockFormat || "HH:mm";
            clockText = clockText.replace("HH", h).replace("mm", m).replace("ss", s);

            if (clockEl) { clockEl.innerHTML = clockText; }

            if (clockDateEl) {
                var lang = config.language || "pt";
                var days, months, de;
                if (lang === "en") {
                    days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
                    months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                              "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                    de = " ";
                } else {
                    days = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sab"];
                    months = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun",
                              "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
                    de = " ";
                }
                clockDateEl.innerHTML = days[now.getDay()] + ", " + now.getDate() + de + months[now.getMonth()];
            }
        }

        function applyConfig() {
            var root = document.documentElement;
            if (config.primaryColor) {
                root.style.setProperty("--primary-color", config.primaryColor);
            }
            if (config.secondaryColor) {
                root.style.setProperty("--secondary-color", config.secondaryColor);
                document.body.style.backgroundColor = config.secondaryColor;
            }
            if (config.baseFontSize) {
                root.style.setProperty("--base-font-size", config.baseFontSize);
            }
            if (config.transition !== undefined) {
                root.style.setProperty("--transition-duration", config.transition + "s");
            }

            if (!config.showProgressBar) {
                progressBar.style.display = "none";
            }

            var albumRow = document.getElementById("info-album-row");
            var peopleRow = document.getElementById("info-people-row");
            var locationRow = document.getElementById("info-location-row");
            var dateRow = document.getElementById("info-date-row");

            if (!config.showAlbumName && albumRow) {
                albumRow.style.display = "none";
            }
            if (!config.showPeopleDesc && peopleRow) {
                peopleRow.style.display = "none";
            }
            if (!config.showImageLocation && locationRow) {
                locationRow.style.display = "none";
            }
            if (!config.showPhotoDate && dateRow) {
                dateRow.style.display = "none";
            }
        }

        function updateInfo(asset) {
            var albumRow = document.getElementById("info-album-row");
            var peopleRow = document.getElementById("info-people-row");
            var locationRow = document.getElementById("info-location-row");
            var dateRow = document.getElementById("info-date-row");

            if (config.showAlbumName && asset.albumName) {
                infoAlbum.innerHTML = asset.albumName;
                if (albumRow) albumRow.style.display = "";
            } else {
                infoAlbum.innerHTML = "";
                if (albumRow) albumRow.style.display = "none";
            }

            if (config.showPeopleDesc && asset.people && asset.people.length > 0) {
                infoPeople.innerHTML = asset.people.join(", ");
                if (peopleRow) peopleRow.style.display = "";
            } else {
                infoPeople.innerHTML = "";
                if (peopleRow) peopleRow.style.display = "none";
            }

            if (config.showImageLocation && asset.location) {
                infoLocation.innerHTML = asset.location;
                if (locationRow) locationRow.style.display = "";
            } else {
                infoLocation.innerHTML = "";
                if (locationRow) locationRow.style.display = "none";
            }

            if (config.showPhotoDate && asset.date) {
                var fmt = config.photoDateFormat || "dd/MM/yyyy";
                infoDate.innerHTML = formatDate(asset.date, fmt);
                if (dateRow) dateRow.style.display = "";
            } else {
                infoDate.innerHTML = "";
                if (dateRow) dateRow.style.display = "none";
            }
        }

        function startProgress() {
            progressWidth = 0;
            progressBar.style.width = "0%";
            var step = 100 / ((config.interval || 20) * 10);
            progressInterval = window.setInterval(function () {
                progressWidth += step;
                if (progressWidth >= 100) {
                    progressWidth = 100;
                }
                progressBar.style.width = progressWidth + "%";
            }, 100);
        }

        function stopProgress() {
            if (progressInterval) {
                window.clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function getThumbUrl(assetId) {
            return "/api/thumbnail/" + assetId;
        }

        function showImage(url, asset) {
            if (!imgEl) { return; }

            imgEl.onload = function () {
                var classes = ["active"];
                if (config.imageFill) {
                    classes.push("fill");
                }
                if (config.imageZoom) {
                    classes.push(Math.random() > 0.5 ? "zoom-in" : "zoom-out");
                }
                if (config.imagePan) {
                    var pans = ["pan-left", "pan-right", "pan-up", "pan-down"];
                    classes.push(pans[Math.floor(Math.random() * pans.length)]);
                }
                imgEl.className = classes.join(" ");
                isTransitioning = false;
                updateInfo(asset);
                startProgress();
            };

            imgEl.onerror = function () {
                isTransitioning = false;
                advanceToNext();
            };

            imgEl.src = url;
        }

        var preloader = null;
        var preloaderTimeout = null;

        function preloadAndShow(url, asset) {
            if (preloader) {
                preloader.onload = null;
                preloader.onerror = null;
                preloader.src = "";
                preloader = null;
            }
            if (preloaderTimeout) {
                clearTimeout(preloaderTimeout);
                preloaderTimeout = null;
            }

            preloader = new Image();
            var done = false;

            function onDone(success) {
                if (done) { return; }
                done = true;
                if (preloaderTimeout) {
                    clearTimeout(preloaderTimeout);
                    preloaderTimeout = null;
                }
                if (success) {
                    showImage(url, asset);
                } else {
                    isTransitioning = false;
                    advanceToNext();
                }
            }

            preloader.onload = function () { onDone(true); };
            preloader.onerror = function () { onDone(false); };

            preloader.src = url;

            preloaderTimeout = window.setTimeout(function () {
                if (!done) { onDone(false); }
            }, 15000);
        }

        function goToIndex(index) {
            if (assets.length === 0) { return; }
            if (isTransitioning) { return; }

            stopProgress();
            isTransitioning = true;
            currentIndex = index;
            if (currentIndex >= assets.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = assets.length - 1;

            var asset = assets[currentIndex];
            preloadAndShow(getThumbUrl(asset.id), asset);
        }

        function advanceToNext() {
            goToIndex(currentIndex + 1);
        }

        window.prevImage = function () {
            goToIndex(currentIndex - 1);
        };

        window.nextImage = function () {
            goToIndex(currentIndex + 1);
        };

        function startSlideshow() {
            if (assets.length === 0) { return; }

            isTransitioning = true;
            var asset = assets[0];
            preloadAndShow(getThumbUrl(asset.id), asset);

            slideInterval = window.setInterval(function () {
                advanceToNext();
            }, (config.interval || 20) * 1000);
        }

        function fetchJSON(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            callback(null, data);
                        } catch (e) {
                            callback("parse error");
                        }
                    } else {
                        callback("http error");
                    }
                }
            };
            xhr.onerror = function () { callback("network error"); };
            xhr.ontimeout = function () { callback("timeout"); };
            xhr.open("GET", url, true);
            xhr.timeout = 15000;
            xhr.send(null);
        }

        function init() {
            fetchServerTime();
            setInterval(fetchServerTime, 60000);

            fetchWeather();
            setInterval(fetchWeather, 600000);

            updateClock();
            window.setInterval(updateClock, 1000);

            var hideTimer;
            function showNav() {
                navPrev.style.opacity = "0.5";
                navNext.style.opacity = "0.5";
                clearTimeout(hideTimer);
                hideTimer = window.setTimeout(function () {
                    navPrev.style.opacity = "0";
                    navNext.style.opacity = "0";
                }, 3000);
            }

            document.addEventListener("mousemove", showNav);
            document.addEventListener("touchstart", showNav);

            fetchJSON("/api/slideshow", function (err, data) {
                if (err) { return; }

                assets = data.assets || [];
                config = data.config || {};

                applyConfig();
                startSlideshow();
            });
        }

        if (document.readyState === "complete" || document.readyState === "interactive") {
            window.setTimeout(init, 0);
        } else {
            document.addEventListener("DOMContentLoaded", init);
        }

    })();
    </script>
</body>
</html>
