version: "3.8"

services:
  immichframe:
    image: ghcr.io/fernandodimas/immichframe_light:latest
    container_name: immichframe
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # === REQUIRED ===
      - IMMICH_URL=http://192.168.16.250:2283
      - IMMICH_API_KEY=your_api_key_here
      - IMMICH_ALBUM_ID=your_album_uuid_here

      # === SLIDESHOW SETTINGS ===
      - INTERVAL_SECONDS=20      # Time between photos (seconds)
      - TRANSITION_DURATION=2     # Fade transition duration (seconds)
      - SHUFFLE=true              # Randomize photo order

      # === DISPLAY SETTINGS ===
      - SHOW_CLOCK=true
      - CLOCK_FORMAT=HH:mm
      - CLOCK_DATE_FORMAT=eeee, d 'de' MMMM 'de' yyyy
      - SHOW_PROGRESS_BAR=true
      - SHOW_PHOTO_DATE=true
      - PHOTO_DATE_FORMAT=dd/MM/yyyy
      - SHOW_IMAGE_DESC=true
      - SHOW_PEOPLE_DESC=true
      - SHOW_ALBUM_NAME=true
      - SHOW_IMAGE_LOCATION=true
      - LANGUAGE=pt               # Options: pt, en, es, fr, de

      # === IMAGE EFFECTS ===
      - IMAGE_ZOOM=true           # Ken Burns zoom effect
      - IMAGE_PAN=false           # Pan animation
      - IMAGE_FILL=false          # Fill space (may crop)

      # === STYLE SETTINGS ===
      - PRIMARY_COLOR=#f5deb3
      - SECONDARY_COLOR=#000000
      - STYLE=none                # Options: none, solid, transition, blur
      - BASE_FONT_SIZE=17px
      - IMAGE_LOCATION_FORMAT=City,State,Country

      # === WEATHER SETTINGS ===
      - WEATHER_API_KEY=          # Get free key at https://openweathermap.org/api
      - UNIT_SYSTEM=metric        # Options: metric, imperial
      - WEATHER_LAT_LONG=40.730610,-73.935242
      - SHOW_WEATHER_DESCRIPTION=true

      # === NIGHT MODE ===
      - NIGHT_MODE=false          # Enable night mode (black screen)
      - NIGHT_MODE_START=22:00    # Start time (HH:mm)
      - NIGHT_MODE_END=07:00      # End time (HH:mm)
