version: "3.8"

services:
  immichframe:
    image: ghcr.io/fernandodimas/immichframe_light:latest
    container_name: immichframe
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # === REQUIRED ===
      - IMMICH_URL=http://192.168.16.250:2283
      - IMMICH_API_KEY=your_api_key_here
      # Multiple albums can be separated by commas (e.g. "id1,id2")
      - IMMICH_ALBUM_ID=your_album_uuid_here

      # === SLIDESHOW SETTINGS ===
      - INTERVAL_SECONDS=20      # Time between photos (seconds)
      - TRANSITION_DURATION=2     # Fade transition duration (seconds)
      - SHUFFLE=true              # Randomize photo order

      # === DISPLAY SETTINGS ===
      - SHOW_CLOCK=true
      - CLOCK_FORMAT=HH:mm
      - CLOCK_DATE_FORMAT=eeee, d 'de' MMMM 'de' yyyy
      - SHOW_PROGRESS_BAR=true
      - SHOW_PHOTO_DATE=true
      - PHOTO_DATE_FORMAT=dd/MM/yyyy
      - SHOW_IMAGE_DESC=true
      - SHOW_PEOPLE_DESC=true
      - SHOW_ALBUM_NAME=true
      - SHOW_IMAGE_LOCATION=true
      - LANGUAGE=pt               # Options: pt, en, es, fr, de

      # === MEMORIES / LAYOUT ===
      - SHOW_MEMORIES=true             # Show photos taken on this day in previous years
      - PRIORITIZE_MEMORIES=true       # Show memories first in the slideshow
      - SPLIT_PORTRAIT=true            # Split portrait photos into two panels

      # === IMAGE EFFECTS ===
      - IMAGE_ZOOM=true           # Ken Burns zoom effect
      - IMAGE_PAN=false           # Pan animation
      - IMAGE_FILL=false          # Fill space (may crop)

      # === STYLE SETTINGS ===
      - PRIMARY_COLOR=#f5deb3
      - SECONDARY_COLOR=#000000
      - STYLE=none                # Options: none, solid, transition, blur
      - BASE_FONT_SIZE=17px
      - IMAGE_LOCATION_FORMAT=City,State,Country

      # === IMAGE RESIZING / CACHE ===
      - RESIZE_IMAGES=true        # Resize/compress thumbnails with Pillow before serving
      - MAX_IMAGE_WIDTH=1024      # Maximum thumbnail width (px)
      - MAX_IMAGE_HEIGHT=768      # Maximum thumbnail height (px)
      - IMAGE_QUALITY=82          # JPEG quality (1-100)
      - THUMB_CACHE_SIZE=50       # Number of processed thumbnails kept in memory

      # === WEATHER SETTINGS ===
      - WEATHER_API_KEY=          # Get free key at https://openweathermap.org/api
      - UNIT_SYSTEM=metric        # Options: metric, imperial
      - WEATHER_LAT_LONG=40.730610,-73.935242
      - SHOW_WEATHER_DESCRIPTION=true
      - SHOW_WEATHER_EXTENDED=true    # Show min/max and feels-like temperatures

      # === NIGHT MODE / BRIGHTNESS ===
      - NIGHT_MODE=false          # Enable night mode (black screen)
      - NIGHT_MODE_START=22:00    # Start time (HH:mm)
      - NIGHT_MODE_END=07:00      # End time (HH:mm)
      - BRIGHTNESS=100            # Software brightness level (10-100, default 100)
      - NIGHT_MODE_BRIGHTNESS=0   # 0 = black screen + pause; 1-100 = keep slideshow running dimmed

      # === TIMEZONE ===
      - TIMEZONE=-3               # UTC offset (e.g., -3 for Brasilia, -5 for New York)
